:14px}.legend{font-size:11px;color:var(--muted);margin:8px 0 12px}.result{display:none;padding:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{text-align:center;background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:10px}.metric b{font-size:28px;display:block}.review{margin-top:18px}.ri{padding:13px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.correct{color:#15803d}.wrong{color:#b91c1c}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.stem{font-size:17px}.metrics{grid-template-columns:repeat(2,1fr)}.timer{font-size:18px}}</style></head><body><header><div class="top"><div><div class="brand">AIM2AIIMS RISHIKESH</div><div class="sub">NEET 2027 • BTS-03 • Interactive CBT</div></div><div class="timer" id="timer">03:00:00</div></div></header><div class="wrap"><div class="layout" id="exam"><main><section class="card qcard" id="qcard"><div class="qtitle"><strong id="qno">Question 1</strong><span id="state">Unattempted</span></div><div class="stem" id="stem"></div><div class="options" id="options"></div><div class="controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="clearResponse">Clear Response</button><button class="btn secondary" id="markReview">Mark for Review</button><button class="btn primary" id="next">Next →</button></div></section><section class="card result" id="result"></section></main><aside class="card side"><h3>Question Palette</h3><div class="legend">Green = answered • Yellow = review • Blue outline = current</div><div class="palette" id="palette"></div><button class="btn primary submit" id="submit">Submit Test</button></aside></div></div><script>const DATA=[{"n":1,"stem":"Statement I: Organ system level of organisation is found in Annelids, Arthropods, Echinoderms and Chordates. Statement II: Different organs work together to form functional systems.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, Statement II is false","Statement I is false, Statement II is true"],"page":3},{"n":2,"stem":"Assertion (A): Reptiles are called cold-blooded animals. Reason (R): They cannot regulate their body temperature internally.","options":["Both A and R are true and R is the correct explanation of A","Both A and R are true but R is not the correct explanation of A","A is true but R is false","A is false but R is true"],"page":3},{"n":3,"stem":"The hollow bones of birds are an adaptation mainly related to:","options":["Increase in body weight for protection","Reduction of body weight for flight","Storage of calcium for eggshell formation","Increase in muscle attachment"],"page":3},{"n":4,"stem":"Statement I: Platyhelminthes have an incomplete digestive system. Statement II: An incomplete digestive system has only one opening serving as both mouth and anus.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, Statement II is false","Statement I is false, Statement II is true"],"page":3},{"n":5,"stem":"Consider the following statements regarding Cnidaria: A. Digestion is both extracellular and intracellular. B. Corals possess a calcium carbonate skeleton. C. In Obelia, polyps produce medusae sexually. D. Medusae produce polyps asexually. Choose the correct statements","options":["A and B only","C and D only","A, B and C only","A, B, C and D"],"page":3},{"n":6,"stem":"Assertion (A): In an open circulatory system, blood is pumped out of the heart and directly bathes the cells and tissues. Reason (R): In a closed circulatory system, blood flows through a network of vessels such as arteries, veins and capillaries.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":4},{"n":7,"stem":"Which statement correctly distinguishes radial symmetry from bilateral symmetry:","options":["Radially symmetrical animals can be divided into two equal halves by only one plane.","Bilaterally symmetrical animals can be divided into equal halves by many planes.","Radially symmetrical animals can be divided into identical halves by several planes passing through the central axis.","Bilaterally symmetrical animals are always asymmetrical."],"page":4},{"n":8,"stem":"Which of the following statements is correct regarding diploblastic animals:","options":["They possess ectoderm, mesoderm and endoderm.","They possess only ectoderm and endoderm as germ layers.","They lack ectoderm.","They possess only mesoderm and endoderm."],"page":4},{"n":9,"stem":"The layer present between ectoderm and endoderm in coelenterates is:","options":["Mesoderm","Mesenchyme","Mesoglea","Coelom"],"page":4},{"n":10,"stem":"Which combination of features correctly represents birds:","options":["Cold-blooded, three-chambered heart, external fertilisation","Warm-blooded, four-chambered heart, internal fertilisation","Warm-blooded, two-chambered heart, external fertilisation","Cold-blooded, four-chambered heart, internal fertilisation"],"page":4},{"n":11,"stem":"Consider the following statements regarding coelom: A. Coelom is a body cavity lined by mesoderm. B. Arthropods, echinoderms and chordates are coelomates. C. In pseudocoelomates, the body cavity is completely lined by mesoderm. D. Platyhelminthes are pseudocoelomates. Select the incorrect answer:","options":["A, B and D only","A and B only","C and D only","A, B, C and D"],"page":5},{"n":12,"stem":"Serial repetition of at least some organs in different body segments is characteristic of ____.","options":["Metamerism","Coelom formation","Diploblasty","Cephalisation"],"page":5},{"n":13,"stem":"Which of the following statements correctly explains why an adult human is placed under Chordata:","options":["Humans possess a complete notochord throughout life.","Humans develop a notochord during embryonic development.","Humans possess a ventral nerve cord.","Humans lack a mesodermally derived supporting structure."],"page":5},{"n":14,"stem":"Match the following List I with List II: List I (Phylum) List II (Body Cavity) A. Porifera 1. True coelom B. Platyhelminthes 2. Acoelomate C. Aschelminthes 3. Pseudocoelomate D. Annelida 4. Acoelomate","options":["A-4, B-3, C-2, D-1","A-3, B-4, C-1, D-2","A-3, B-2, C-4, D-1","A-4, B-2, C-3, D-1"],"page":5},{"n":15,"stem":"The water canal system in sponges is primarily involved in:","options":["Locomotion only","Food collection, respiration, and waste removal","Reproduction only","Protection only"],"page":6},{"n":16,"stem":"Which of the following is an oviparous mammal:","options":["Macropus (Kangaroo)","Ornithorhynchus (Platypus)","Panthera leo (Lion)","Elephas (Elephant)"],"page":6},{"n":17,"stem":"Which of the following is correctly matched:","options":["Spongilla - Marine sponge","Euspongia - Freshwater sponge","Sycon - Bath sponge","Spongilla - Freshwater sponge"],"page":6},{"n":18,"stem":"Which of the following statements about Cnidaria are correct: A. They exhibit tissue level of organization. B. They are diploblastic animals. C. They possess a gastrovascular cavity with a single opening. D. They are triploblastic animals.","options":["A, B and C only","A and D only","B and D only","A, B, C and D"],"page":6},{"n":19,"stem":"The skeleton of sponges is composed of:","options":["Chitin only","Calcium carbonate shell","Spicules or spongin fibres","Cartilage"],"page":6},{"n":20,"stem":"Select the correct statements regarding cnidoblasts (cnidocytes): A. They contain nematocysts. B. They help in anchorage. C. They are used for defense and prey capture. D. They are involved in blood circulation.","options":["A, B and C only","A and D only","B and D only","A, B, C and D"],"page":6},{"n":21,"stem":"Which of the following statements about polyp and medusa are correct: A. Polyp is sessile and cylindrical. B. Medusa is umbrella-shaped and free- swimming. C. Hydra represents the polyp form. D. Aurelia represents the medusa form.","options":["A and B only","A, B and C only","A, B, C and D","B and D only"],"page":7},{"n":22,"stem":"Which of the following statements are correct regarding Amphibia: A. Ichthyophis is a limbless amphibian. B. Rana is a frog. C. Bufo is a toad. D. Hyla is a tree frog.","options":["A, B and C only","B, C and D only","A, B, C and D","A and D only"],"page":7},{"n":23,"stem":"Statement I: Ctenophores possess eight external rows of ciliated comb plates used for locomotion. Statement II: Digestion in ctenophores is only intracellular.","options":["Both Statement I and Statement II are true.","Both Statement I and Statement II are false.","Statement I is true but Statement II is false.","Statement I is false but Statement II is true."],"page":7},{"n":24,"stem":"Choose the correct statements regarding Class Mammalia: A. Skin possesses hair. B. External ears or pinnae are present. C. Heart is two-chambered. D. They are homoiothermous animals.","options":["Only A and B","Only A, B and D","Only C and D","A, B, C and D"],"page":7},{"n":25,"stem":"Statement I: Bioluminescence is a characteristic feature of ctenophores. Statement II: Reproduction in ctenophores occurs only by sexual means, with external fertilisation and indirect development.","options":["Both Statement I and Statement II are true.","Both Statement I and Statement II are false.","Statement I is true but Statement II is false.","Statement I is false but Statement II is true."],"page":8},{"n":26,"stem":"Which of the following pairs is/are correctly matched: A. Adamsia - Sea anemone B. Gorgonia - Sea fan C. Pennatula - Sea pen D. Meandrina - Brain coral","options":["A and B only","C and D only","A, B and C only","A, B, C and D"],"page":8},{"n":27,"stem":"Which of the following statements are correct: A. Scoliodon is commonly called dog fish. B. Pristis is commonly called saw fish. C. Carcharodon is the great white shark. D. Trygon is an electric ray.","options":["A, B and C only","A and D only","B and C only","A, B, C and D"],"page":8},{"n":28,"stem":"Osteichthyes are characterized by the presence of:","options":["Cartilaginous endoskeleton and placoid scales","Bony endoskeleton and operculum covering gills","Cartilaginous endoskeleton and no operculum","Notochord persistent throughout life"],"page":8},{"n":29,"stem":"Consider the following statements regarding alternation of generations (metagenesis) in Cnidaria: A. Polyps reproduce asexually to produce medusae. B. Medusae reproduce sexually to produce polyps. C. Both polyp and medusa reproduce only sexually. D. Obelia exhibits metagenesis.","options":["A, B and D only","A and C only","B and D only","A, B, C and D"],"page":8},{"n":30,"stem":"Consider the following statements regarding Chondrichthyes: A. Heart is two-chambered with one auricle and one ventricle. B. They are poikilothermous animals. C. Fertilisation is internal. D. Males possess claspers on pelvic fins.","options":["A, B and C only","B and D only","A, B, C and D","A and C only"],"page":9},{"n":31,"stem":"Females are often longer than males in Aschelminthes. This condition is known as:","options":["Metamerism","Sexual dimorphism","Polymorphism","Regeneration"],"page":9},{"n":32,"stem":"An aquatic annelid loses its parapodia due to injury. Which function will be most affected:","options":["Excretion","Digestion","Swimming and locomotion","Blood circulation"],"page":9},{"n":33,"stem":"Which of the following correctly matches the organism with its reproductive nature:","options":["Nereis - Monoecious","Earthworm - Dioecious","Hirudinaria - Dioecious","Nereis - Dioecious"],"page":9},{"n":34,"stem":"Arthropods are called \"Arthropoda\" because they possess:","options":["Segmented body only","Jointed appendages","Chitinous exoskeleton only","Open circulatory system"],"page":9},{"n":35,"stem":"Consider the following statements: A. Mollusca is the second largest phylum of Animal Kingdom. B. Body of molluscs is segmented and metamerically arranged. C. Mantle cavity contains feather-like gills. D. Radula is a rasping organ used for feeding. Choose the correct option:","options":["A, C and D only","A and B only","B and C only","A, B, C and D"],"page":10},{"n":36,"stem":"Consider the following statements: A. Molluscs are triploblastic, bilaterally symmetrical and coelomate animals. B. Mantle is a soft spongy layer covering the visceral hump. C. Radula performs respiratory function in molluscs. D. Molluscs possess organ-system level of organisation. Choose the correct option:","options":["A, B and D only","A and C only","B, C and D only","A, B, C and D"],"page":10},{"n":37,"stem":"Echinoderms show which type of symmetry during different stages of life:","options":["Larva radial, adult bilateral","Larva bilateral, adult radial","Both larva and adult bilateral","Both larva and adult radial"],"page":10},{"n":38,"stem":"Assertion (A): Respiration in hemichordates occurs through gills. Reason (R): Hemichordates are exclusively terrestrial animals.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"page":10},{"n":39,"stem":"Which of the following statements correctly differentiate chordates from non-chordates: A. Chordates possess a notochord while non- chordates do not. B. Chordates have a dorsal hollow nerve cord, whereas non-chordates have a ventral solid nerve cord (if present). C. Pharyngeal gill slits are characteristic of chordates. D. Heart is ventral in chordates and dorsal (if present) in non-chordates.","options":["A and B only","A, B and C only","B, C and D only","A, B, C and D"],"page":11},{"n":40,"stem":"Which of the following belong to Urochordata: A. Ascidia B. Salpa C. Doliolum D. Branchiostoma","options":["A and D only","A, B and C only","B, C and D only","A, B, C and D"],"page":11},{"n":41,"stem":"Which of the following statements regarding Vertebrata are correct: A. Notochord is present during embryonic development. B. Adult vertebrates possess vertebral column. C. All chordates are vertebrates. D. All vertebrates are chordates.","options":["A and C only","B and D only","A, B and D only","A, B, C and D"],"page":11},{"n":42,"stem":"Assertion (A): Chondrichthyes must swim continuously to avoid sinking. Reason (R): They lack an air bladder which helps in buoyancy.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":11},{"n":43,"stem":"Consider the following statements about reptiles: A. They are mostly terrestrial animals. B. They are poikilothermic animals. C. They have a four-chambered heart in all members. D. Development is direct. Correct statements are:","options":["A, B and D only","B and C only","A and C only","A, B, C and D"],"page":12},{"n":44,"stem":"Select the correct statement for the given diagram of animal","options":["It is triploblastic animal","It is coelomate animal","It is oviparous animal","All"],"page":12},{"n":45,"stem":"Given below are two statements Statement I: In Chlorella and Amoeba reproduction synonymous with growth Statement II : Metabolism is absent in some living organism. Choose the correct answer from the option given below:","options":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"page":12},{"n":46,"stem":"Select the correct match A. Seed habit I. Angiosperm B. Covered seed II. Bryophyte C. Naked seed III. Pteridophytes D. First terrestrial IV. Gymnosperm plants","options":["A-I, B-II, C-III, D-IV","A-IV, B-I, C-II, D-III","A-III, B-I, C-IV, D-II","A-I, B-IV, C-II, D-III"],"page":13},{"n":47,"stem":"How many members of plant kingdom have antheridia. Cedrus, Sequoia, Ginkgo, Adiantum, Psilotum, Pteris, Sphagnum, Riccia, Polytrichum .","options":["9","8","7","6"],"page":13},{"n":48,"stem":"According to katherine Esau Match Column I with Column II. Column I Column II A. Plant Anatomy I. 1960 B. Anatomy of II. 1954 Seed Plants C. National Academy III. 1957 of Sciences D. National Medal IV. 1989 of Science","options":["A-IV, B-I, C-II, D-III","A-I, B-II, C-IV, D-III","A-II, B-III, C-I, D-IV","A-II, B-I, C-III, D-IV"],"page":13},{"n":49,"stem":"In most dicotyledonous plants, the tap root system develops from:","options":["Stem base","Plumule","Radicle","Leaf base"],"page":13},{"n":50,"stem":"Statement I: In dicot plants, the radicle elongates to form the primary root. Statement II: The primary root and its branches form the tap root system.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":14},{"n":51,"stem":"Which of the following is NOT a function of roots:","options":["Absorption of water and minerals","Anchorage of plant body","Synthesis of plant growth regulators","Photosynthesis in most plants"],"page":14},{"n":52,"stem":"Observe the leaf shown in the image of China rose (Hibiscus). Which of the following features correctly describes the leaf type :","options":["Compound leaf with pinnate venation","Simple leaf with alternate phyllotaxy and reticulate venation","Palmately compound leaf with opposite phyllotaxy","Simple leaf with whorled arrangement and parallel venation"],"page":14},{"n":53,"stem":"Assertion (A): In mustard plant, the root system is of tap root type. Reason (R): Mustard is a dicot plants and in dicots the primary root develops from the direct elongation of the radicle and gives rise to lateral roots.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"page":14},{"n":54,"stem":"Which of the following statements is/are correct: A. Root cap protects the tender root apex. B. Meristematic cells divide repeatedly. C. Root hairs arise from the region of maturation. D. Root cap absorbs water and minerals.","options":["A and D only","A, B and C only","B and D only","A, B, C and D"],"page":15},{"n":55,"stem":"Assertion (A): Wheat plant possesses a fibrous root system. Reason (R): In monocotyledonous plants, the primary root is short-lived and is replaced by roots arising from the base of the stem.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":15},{"n":56,"stem":"Identify the correct sequence from root tip towards the upper region: A. Root cap B. Meristematic region C. Region of elongation D. Region of maturation      ","options":["A B C D","B A C D      ","A C B D","D C B A"],"page":15},{"n":57,"stem":"Which of the following statements are correct: A. Cells of meristematic region are thin-walled. B. Cells of elongation region are responsible for increase in root length. C. Root hairs help in absorption of water and minerals. D. Root hairs are formed in the meristematic region.","options":["B and D only","A, B and C only","A and C only","A, B, C and D"],"page":15},{"n":58,"stem":"In silk cotton, all leaflets arise from a common point at the tip of the petiole. Such a leaf is:","options":["Pinnately compound leaf","Palmately compound leaf","Simple leaf","Parallel-veined leaf"],"page":16},{"n":59,"stem":"Assertion (A): Monstera shows adventitious roots. Reason (R): These roots arise from parts of the plant other than the radicle.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":16},{"n":60,"stem":"A leaf of neem has several leaflets arranged on a common axis called rachis. This type of leaf is:","options":["Simple leaf","Palmately compound leaf","Pinnately compound leaf","Sessile leaf"],"page":16},{"n":61,"stem":"Leaves originate from the:","options":["Root apical meristem","Vascular cambium","Shoot apical meristem","Cork cambium"],"page":16},{"n":62,"stem":"Match List I with List II: List I List II A. Rachis 1. Common axis bearing leaflets B. Pinnately 2. Leaflets attached compound leaf along rachis C. Palmately 3. Leaflets attached at compound leaf tip of petiole D. Leaflet 4. No axillary bud present","options":["A-3, B-2, C-1, D-4","A-2, B-3, C-4, D-1","A-1, B-4, C-2, D-3","A-1, B-2, C-3, D-4"],"page":16},{"n":63,"stem":"Statement I: Parallel venation is generally found in most monocotyledonous plants. Statement II: Leaves of dicotyledonous plants generally possess parallel venation.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":17},{"n":64,"stem":"Consider the following statements regarding a flower: A. A flower is a modified shoot. B. The shoot apical meristem changes into a floral meristem. C. Internodes elongate extensively during flower formation. D. Floral appendages are produced laterally at successive nodes. Choose the correct statements:","options":["B, C and D only","A and C only","A, B and D only","A, B, C and D"],"page":17},{"n":65,"stem":"Match Column I with Column II regarding phyllotaxy: Column I Column II (Plant) (Type of Phyllotaxy) A. China rose P. Opposite B. Guava Q. Alternate C. Alstonia R. Whorled D. Mustard S. Opposite","options":["A-Q, B-R, C-P, D-Q","A-P, B-Q, C-R, D-S","A-R, B-P, C-Q, D-S","A-Q, B-P, C-R, D-Q"],"page":17},{"n":66,"stem":"Consider the following statements regarding inflorescence: A. Inflorescence refers to the arrangement of flowers on the floral axis. B. In racemose inflorescence, the main axis continues to grow. C. In racemose inflorescence, flowers are arranged in basipetal succession. D. In cymose inflorescence, the main axis terminates in a flower. Choose the correct statements:","options":["B and D only","A and C only","A, B and D only","A, B, C and D"],"page":18},{"n":67,"stem":"Assertion (A): A flower containing both androecium and gynoecium is called bisexual. Reason (R): Androecium and gynoecium are the male and female reproductive organs of the flower, respectively.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":18},{"n":68,"stem":"Match the following: Column I Column II A. Mustard 1. Asymmetric B. Pea 2. Zygomorphic C. Canna 3. Actinomorphic D. Bean 4. Bilateral symmetry","options":["A-1, B-2, C-3, D-4","A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4","A-3, B-2, C-1, D-4"],"page":18},{"n":69,"stem":"Consider the following statements about a typical flower: A. Flower is the reproductive unit of angiosperms. B. Calyx and corolla are reproductive organs. C. Androecium and gynoecium are reproductive organs. D. Thalamus is the swollen end of the pedicel. Choose the correct statements:","options":["A, B and C only","A, C and D only","B and D only","A, B, C and D"],"page":18},{"n":70,"stem":"Statement I: Actinomorphic flowers can be divided into two equal halves by any vertical plane passing through the centre. Statement II: Mustard and Datura are actinomorphic flowers.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":19},{"n":71,"stem":"Perigynous flowers possess:","options":["Superior ovary","Half inferior ovary","Inferior ovary","No ovary"],"page":19},{"n":72,"stem":"Statement I: Canna is an asymmetric flower. Statement II: An asymmetric flower can be divided into two similar halves by any vertical plane passing through the centre.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":19},{"n":73,"stem":"In hypogynous flowers, the gynoecium occupies the:","options":["Lowest position","Central position","Highest position","Lateral position"],"page":19},{"n":74,"stem":"Statement I: Corolla is composed of petals. Statement II: Petals are usually brightly coloured.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":19},{"n":75,"stem":"Match the type of aestivation with the correct example: Column I Column II A. Valvate i. Pea B. Twisted ii. China rose C. Vexillary iii. Cassia D. Imbricate iv. Calotropis","options":["A-iii, B-iv, C-ii, D-i","A-ii, B-iii, C-iv, D-i","A-iv, B-ii, C-i, D-iii","A-iv, B-i, C-iii, D-ii"],"page":20},{"n":76,"stem":"Consider the following statements: I. In valvate aestivation, adjacent petals overlap each other. II. In twisted aestivation, one margin of a petal overlaps the next petal. III. In imbricate aestivation, overlapping occurs without any definite direction. IV. Vexillary aestivation is characteristic of pea flower. Choose the correct option:","options":["I and II only","II, III and IV only","I, III and IV only","I, II, III and IV"],"page":20},{"n":77,"stem":"The arrangement of ovules within the ovary is called:","options":["Vernation","Aestivation","Placentation","Phyllotaxy"],"page":20},{"n":78,"stem":"Statement I: In imbricate aestivation, overlapping of petals occurs in a definite direction. Statement II: Cassia and Gulmohur show imbricate aestivation.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":20},{"n":79,"stem":"Match the following: Column I Column II A. Pea i. Axile placentation B. Tomato ii. Basal placentation C. Mustard iii. Marginal placentation D. Sunflower iv. Parietal placentation","options":["A-iii, B-iv, C-ii, D-i","A-ii, B-iii, C-iv, D-i","A-iii, B-i, C-iv, D-ii","A-iv, B-a, C-iii, D-ii"],"page":21},{"n":80,"stem":"Consider the following statements: A. Axile placentation occurs in a multilocular ovary. B. Parietal placentation is found in mustard. C. Basal placentation has many ovules attached to the base. D. Free central placentation lacks septa. Choose the correct option:","options":["A, B and D only","A and C only","B and C only","A, B, C and D"],"page":21},{"n":81,"stem":"Which one of the following combinations is correct:","options":["Primrose - Axile - Multilocular ovary","Dianthus - Free central - Septa absent","Mustard - Basal - Single ovule","Pea - Parietal - False septum present"],"page":21},{"n":82,"stem":"Consider the following statements regarding fruits: A. Fruit is a mature or ripened ovary developed after fertilisation. B. Parthenocarpic fruits are formed without fertilisation of the ovary. C. In all fruits, the pericarp is dry. D. A thick and fleshy pericarp is differentiated into epicarp, mesocarp and endocarp. Which of the above statements are correct:","options":["A, B and D only","A and C only","B and C only","A, B, C and D"],"page":21},{"n":83,"stem":"Arrange the following events in the correct sequence of fruit formation: A. Fertilisation B. Development of ovary into fruit C. Formation of zygote D. Maturation (ripening) of fruit      ","options":["B A C D","C A B D      ","A B C D","A C B D"],"page":22},{"n":84,"stem":"Read the following statements: A. Fruit is a characteristic feature of flowering plants. B. The fruit wall is known as pericarp. C. Parthenocarpic fruits are produced as a result of fertilisation. D. Seeds are generally present inside the fruit. Choose the correct option:","options":["A, B and C only","A, B and D only","B, C and D only","A, C and D only"],"page":22},{"n":85,"stem":"Match the following: A. Radicle P. Embryonic root B. Cotyledon Q. Seed leaf C. Embryo R. Consisting of an embryonal axis and cotyledon Choose the correct option:","options":["A-P, B-Q, C-R","A-Q, B-R, C-P","A-R, B-P, C-Q","A-P, B-R, C-Q"],"page":22},{"n":86,"stem":"Match the following structures with their correct description: Column I Column II A. Hilum 1. Embryonic shoot B. Micropyle 2. Small pore above hilum C. Radicle 3. Scar on seed coat D. Plumule 4. Embryonic root Choose the correct option:","options":["A-4, B-1, C-2, D-3","A-2, B-3, C-1, D-4","A-3, B-2, C-4, D-1","A-1, B-4, C-3, D-2"],"page":22},{"n":87,"stem":"Consider the following statements: A. Cotyledons of dicot seeds are usually fleshy and store food. B. Endosperm is absent in mature seeds of pea and gram. C. Micropyle is a scar formed due to attachment of seed to fruit. D. Embryo consists of embryonal axis and cotyledons. Which statements are correct:","options":["A, B and D only","A and C only","B and C only","A, B, C and D"],"page":23},{"n":88,"stem":"Which of following is not correctly matched Column –I Column –II","options":["A. Mustard","B. Brinjal","C. Peach","D. Cucumber"],"page":23},{"n":89,"stem":"Assertion (A): The plumule and radicle of a maize embryo are enclosed by coleoptile and coleorhiza, respectively. Reason (R): Coleoptile and coleorhiza protect the radicle and plumule respectively during seed germination.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":23},{"n":90,"stem":"Assertion (A): Monocot seeds generally have a large endosperm . Reason (R): Diploid endosperm stores food required for embryo development.","options":["Both A and R are correct and R is the correct explanation of A","Both A and R are correct but R is not the correct explanation of A","A is correct but R is incorrect","A is incorrect but R is correct"],"page":24}];const KEY=[];const TEST='BTS-03';let cur=0,ans=Array(DATA.length).fill(null),marked=Array(DATA.length).fill(false),done=false,seconds=10800;const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;$('timer').textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function palette(){let p=$('palette');p.innerHTML='';DATA.forEach((q,i)=>{let b=document.createElement('button');b.className='p'+(ans[i]!=null?' a':'')+(marked[i]?' m':'')+(i===cur?' c':'');b.textContent=q.n;b.onclick=()=>{cur=i;render()};p.appendChild(b)})}function render(){let q=DATA[cur];$('qno').textContent='Question '+q.n;$('state').textContent=ans[cur]==null?(marked[cur]?'Marked for Review':'Unattempted'):(marked[cur]?'Answered • Review':'Answered');$('stem').textContent=q.stem;let o=$('options');o.innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[cur]===i+1?' selected':'');b.innerHTML='<b>('+String(i+1)+')</b> '+esc(v);b.onclick=()=>{if(!done){ans[cur]=i+1;render()}};o.appendChild(b)});$('prev').disabled=cur===0;$('next').disabled=cur===DATA.length-1;palette();window.scrollTo({top:0,behavior:'smooth'})}function submit(){if(done)return;if(!confirm('Submit this test?'))return;done=true;clearInterval(id);show()}async function show(){
 if(done===false)done=true;
 if(id){clearInterval(id);id=null}
 const u=ans.filter(a=>a==null).length;
 $('result').innerHTML='<h2>'+TEST+' Submitted</h2><p>Attempt details are recorded, but a verified answer key was not included for this paper. Correct/wrong counts and marks cannot be reliably calculated until the answer key is added.</p><div class="metrics"><div class="metric"><b>'+ans.filter(a=>a!=null).length+'</b>Attempted</div><div class="metric"><b>'+u+'</b>Unattempted</div></div>'+reviewHtml(false)+'<button class="btn secondary" onclick="location.reload()">Reattempt Test</button>';
 $('qcard').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';
 await saveAttempt();
}function reviewHtml(hasKey){const misses=DATA.map((q,i)=>({q,i,a:ans[i],k:hasKey?KEY[i]:null})).filter(x=>x.a==null||(x.k!=null&&x.a!==x.k));const cards=misses.length?misses.map(({q,i,a,k})=>'<div class="ri" style="border-left:4px solid #b91c1c"><b>Q'+q.n+' · '+(a==null?'Unattempted':'Incorrect')+'</b><div style="margin:8px 0">'+esc(q.stem)+'</div><ol style="padding-left:24px">'+q.options.map((o,j)=>'<li style="margin:5px 0;'+(k===j+1?'color:#15803d;font-weight:bold;':a===j+1?'color:#b91c1c;font-weight:bold;':'')+'">'+esc(o)+(a===j+1?' — Your answer':'')+(k===j+1?' — Correct answer':'')+'</li>').join('')+'</ol></div>').join(''):'<p>Great! No incorrect or unattempted questions.</p>';return '<div class="review"><h3>❌ Incorrect & Unattempted Questions ('+misses.length+')</h3><p>Review these questions, your selected option, and the correct answer.</p>'+cards+'<h3>📋 All Questions Review</h3>'+DATA.map((q,i)=>{let a=ans[i],k=hasKey?KEY[i]:null;let cl=hasKey?(a==null?'':a===k?'correct':'wrong'):'';return '<div class="ri"><b>Q'+q.n+'</b><div>'+esc(q.stem)+'</div><div class="small">Your answer: '+(a==null?'Not attempted':'Option '+a)+(k?' • Correct answer: Option '+k:'')+'</div>'+(cl?'<div class="'+cl+'"><b>'+ (cl==='correct'?'Correct':'Incorrect')+'</b></div>':'')+'</div>'}).join('')+'</div>'}let id=null;function startClock(){if(id||done)return;id=setInterval(()=>{if(seconds<=0){seconds=0;clock();done=true;clearInterval(id);id=null;show();return}seconds--;clock()},1000)}function stopClock(){if(id){clearInterval(id);id=null}}window.startExamClock=startClock;window.stopExamClock=stopClock;clock();$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur<DATA.length-1){cur++;render()}};$('clearResponse').onclick=()=>{ans[cur]=null;render()};$('markReview').onclick=()=>{marked[cur]=!marked[cur];render()};$('submit').onclick=submit;render();</script><style>

<script>
(()=>{
 const sb=window.supabase.createClient('https://hwndciclhjwicallmtfr.supabase.co','sb_publishable_PAfy8xgj34tNS-SNNmH-eQ_VMEJVAYw');
 const gate=document.getElementById('authGate'),msg=document.getElementById('authMsg');let activeUser=null,saved=false;
 function message(t){msg.textContent=t}
 async function refreshSession(){const {data,error}=await sb.auth.getSession();if(error)message(error.message);if(data.session){activeUser=data.session.user;gate.style.display='none';document.getElementById('authUser').textContent=activeUser.email||'Signed in';document.getElementById('signOutBtn').style.display='inline-block';window.startExamClock&&window.startExamClock()}else{window.stopExamClock&&window.stopExamClock();gate.style.display='flex';document.getElementById('authUser').textContent='';document.getElementById('signOutBtn').style.display='none'}}
 document.getElementById('signInBtn').onclick=async()=>{message('Signing in…');let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPass').value});if(error)message(error.message);else{activeUser=data.user;await refreshSession()}};

 document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();activeUser=null;await refreshSession()};
 window.saveAttempt=async function(){
  if(saved)return;saved=true;
  const total=DATA.length,attempted=ans.filter(a=>a!==null).length,unattempted=total-attempted;
  const hasKey=KEY.length===total;
  const correct=hasKey?ans.reduce((n,a,i)=>n+(a===KEY[i]?1:0),0):null;

  const score=hasKey?correct*4-incorrect:null;
  const accuracy=hasKey?(attempted?correct/attempted*100:0):null;
  const studentKey=activeUser?.id||'guest';
  const storageKey='aim2aiims_attempts_'+studentKey;

  let remoteRows=[];
  if(activeUser){
   try{
    const {data,error}=await sb.from('test_attempts').select('test_id,attempt_number,score,correct,incorrect,unattempted,total_questions,accuracy,created_at').eq('user_id',activeUser.id).eq('test_id',TEST).order('attempt_number',{ascending:false}).limit(50);
    if(error)throw error;remoteRows=data||[];
   }catch(e){console.warn('Could not read cloud history:',e.message||e)}
  }
  const maxLocal=localRows.filter(r=>r.test_id===TEST).reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const maxRemote=remoteRows.reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const attempt=Math.max(maxLocal,maxRemote)+1;

  const details=DATA.map((q,i)=>({question_number:q.n,question:q.stem,options:q.options,selected_option:ans[i],correct_option:hasKey?KEY[i]:null,marked_for_review:!!marked[i],status:ans[i]==null?'unattempted':!hasKey?'answered':ans[i]===KEY[i]?'correct':'incorrect'}));
  const record={test_id:TEST,test_name:TEST,attempt_number:attempt,created_at:new Date().toISOString(),total_questions:total,attempted,correct,incorrect,unattempted,score,accuracy,question_details:details,student_id:activeUser?.id||null,storage:'local'};
  localRows.push(record);
  try{localStorage.setItem(storageKey,JSON.stringify(localRows))}catch(e){console.warn('Local result storage failed:',e)}
  let cloudSaved=false,cloudError='';

   try{

    if(error)throw error;cloudSaved=true;record.storage='local+cloud';

   }catch(e){cloudError=e.message||String(e);console.warn('Cloud result save failed:',cloudError)}

  const priorScore=previous&&previous.score!==null&&previous.score!==undefined?Number(previous.score):null;

   else html+='<p>Previous attempt #'+previous.attempt_number+' found; score comparison unavailable because a scored answer key is not available.</p>';

  html+='<h4>Recent attempts</h4><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Attempt</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Date</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Marks</th></tr></thead><tbody>';

  box.innerHTML=html;$('result').appendChild(box);
 };
 sb.auth.onAuthStateChange((_event,session)=>{activeUser=session?.user||null;refreshSession()});refreshSession();
