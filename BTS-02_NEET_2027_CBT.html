<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTS-02 NEET 2027 CBT</title><style>:root{--nav:#0a2450;--blue:#2563eb;--bg:#eef4fb;--line:#d8e1ee;--text:#13233c;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:10;background:linear-gradient(110deg,#071a3b,#123e82);color:#fff;padding:10px 14px;box-shadow:0 3px 12px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:13px;font-weight:800}.sub{font-size:11px;opacity:.85}.timer{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}.wrap{max-width:1200px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #16335d12}.qcard{padding:18px}.qtitle{display:flex;justify-content:space-between}.stem{font-size:18px;line-height:1.6;margin:18px 0;white-space:pre-wrap}.options{display:grid;gap:10px}.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;text-align:left;font-size:16px;cursor:pointer}.opt.selected{background:#eff6ff;border:2px solid var(--blue)}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef7;color:#18365f}.side{padding:14px;position:sticky;top:72px;height:max-content}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:420px;overflow:auto}.p{padding:8px 0;border:1px solid var(--line);border-radius:7px;background:#fff}.p.a{background:#dcfce7;border-color:#86efac}.p.m{background:#fef3c7;border-color:#f59e0b}.p.c{outline:2px solid #60a5fa;background:#dbeafe}.submit{width:100%;margin-top:14px}.legend{font-size:11px;color:var(--muted);margin:8px 0 12px}.result{display:none;padding:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{text-align:center;background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:10px}.metric b{font-size:28px;display:block}.review{margin-top:18px}.ri{padding:13px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.correct{color:#15803d}.wrong{color:#b91c1c}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.stem{font-size:17px}.metrics{grid-template-columns:repeat(2,1fr)}.timer{font-size:18px}}</style></head><body><header><div class="top"><div><div class="brand">AIM2AIIMS RISHIKESH</div><div class="sub">NEET 2027 • BTS-02 • Interactive CBT</div></div><div class="timer" id="timer">03:00:00</div></div></header><div class="wrap"><div class="layout" id="exam"><main><section class="card qcard" id="qcard"><div class="qtitle"><strong id="qno">Question 1</strong><span id="state">Unattempted</span></div><div class="stem" id="stem"></div><div class="options" id="options"></div><div class="controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="clearResponse">Clear Response</button><button class="btn secondary" id="markReview">Mark for Review</button><button class="btn primary" id="next">Next →</button></div></section><section class="card result" id="result"></section></main><aside class="card side"><h3>Question Palette</h3><div class="legend">Green = answered • Yellow = review • Blue outline = current</div><div class="palette" id="palette"></div><button class="btn primary submit" id="submit">Submit Test</button></aside></div></div><script>const DATA=[{"n":1,"stem":"Natural classification systems are based on:","options":["Few superficial characters only","Natural affinities among organisms","Economic importance","Habitat alone"],"page":3},{"n":2,"stem":"Consider the following statements regarding isogamy which is correct: A. Isogamy involves fusion of similar-sized gametes. B. Ulothrix has flagellated isogametes. C. Spirogyra has non-flagellated anisogametes. D. Isogamy always involves motile gametes.","options":["A, B and C only","A and B only","B, C and D only","A, B, C and D"],"page":3},{"n":3,"stem":"Which of the following classification systems is based on evolutionary relationships among organisms:","options":["Artificial classification","Natural classification","Phylogenetic classification","Numerical taxonomy"],"page":3},{"n":4,"stem":"Match the following and choose the correct option. A. Numerical taxonomy P. Chemical constituents B. Cytotaxonomy Q. Chromosome number and behaviour C. Chemotaxonomy R. All observable characters using computers","options":["A-R, B-Q, C-P","A-P, B-R, C-Q","A-Q, B-P, C-R","A-R, B-P, C-Q"],"page":3},{"n":5,"stem":"Consider the following statements which is correct: A. Anisogamy involves fusion of dissimilar-sized gametes. B. Eudorina exhibits anisogamy. C. Oogamy involves a large non-motile female gamete and a smaller motile male gamete. D. Volvox and Fucus exhibit oogamy.","options":["A, B and C only","B, C and D only","A, C and D only","A, B, C and D"],"page":4},{"n":6,"stem":"Assertion (A): The plant body of Chlorophyceae may be unicellular, colonial, or filamentous. Reason (R): All members of Chlorophyceae have only filamentous thalli.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":4},{"n":7,"stem":"Which of the following statements about algae's role in nature is correct:","options":["Algae fix less than 10% of the total carbon dioxide on earth","At least half of the total CO2 fixation on earth is carried out by algae","Algae decrease the level of dissolved oxygen in water","Algae are not primary producers in aquatic food chains"],"page":4},{"n":8,"stem":"Consider the following statements which is incorrect statement: A. Sexual reproduction in algae occurs through fusion of two gametes. B. Fragmentation is a method of vegetative reproduction. C. Spirogyra shows isogamy with motile gametes. D. Ulothrix exhibits oogamy.","options":["A, B and C only","A and B only","B, C and D only","C and D only"],"page":4},{"n":9,"stem":"Agar, used to grow microbes and in preparing ice- creams and jellies, is obtained from which algae:","options":["Chlorella and Sargassum","Porphyra and Laminaria","Gelidium and Gracilaria","Chlorella alone"],"page":5},{"n":10,"stem":"Assertion (A): Members of chlorophyceae are commonly called green algae. Reason (R): They possess chlorophyll a and b as the dominant photosynthetic pigments.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":5},{"n":11,"stem":"Which of the following statements regarding Chlorophyceae are correct: I. They are commonly called green algae due to dominance of chlorophyll a and b II. The plant body may be unicellular, colonial or filamentous III. Pyrenoids contain only starch and no protein IV. The cell wall has an inner layer of cellulose and outer layer of pectose","options":["I, II and III only","I, II and IV only","II, III and IV only","I, III and IV only"],"page":5},{"n":12,"stem":"Bryophytes are called the amphibians of the plant kingdom because:","options":["They live only in water","They live only on land and not required water","They live on land but require water for sexual reproduction","They possess vascular tissues"],"page":5},{"n":13,"stem":"Assertion (A): Pyrenoids are storage bodies present in the chloroplasts of some green algae. Reason (R): Pyrenoids contain protein besides starch.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":6},{"n":14,"stem":"Which of the following statements regarding Phaeophyceae are incorrect: I. They are primarily fresh water algae. II. Food is stored mainly as laminarin and mannitol. III. The plant body is commonly differentiated into holdfast, stipe and frond. IV. Brown algae possess chlorophyll a and b as the major chlorophyll pigments.","options":["I and II only","II and III only","I, II and III only","I and IV only"],"page":6},{"n":15,"stem":"The dominant, photosynthetic and independent phase in bryophytes is the:","options":["Sporophyte","Embryo","Zygote","Gametophyte"],"page":6},{"n":16,"stem":"Which of the following statements regarding reproduction in Phaeophyceae are incorrect: I. Vegetative reproduction occurs by fragmentation. II. Asexual reproduction is by biflagellate, pear- shaped zoospores. III. Zoospores bear two unequal apically attached flagella. IV. Sexual reproduction is only oogamous.","options":["I and II only","III and IV only","II, III and IV only","I, II and III only"],"page":6},{"n":17,"stem":"The sporophyte of bryophytes is:","options":["Free-living and independent","Attached to the gametophyte and derives nourishment from it","Haploid and produces gametes","The dominant phase of the life cycle"],"page":7},{"n":18,"stem":"The plant body of a liverwort such as Marchantia is:","options":["Filamentous","Cylindrical with true roots","Tree-like with vascular tissues","Thalloid and dorsiventral"],"page":7},{"n":19,"stem":"Which of the following statements regarding Phaeophyceae are correct: I. The cell wall is cellulosic and externally covered by a gelatinous coating of algin. II. Fucoxanthin imparts the olive green to brown colour. III. Kelps may attain a height of about 100 metres. IV. Gametes are pear-shaped and bear two laterally attached flagella.","options":["I and II only","II, III and IV only","I, III and IV only","I, II, III and IV"],"page":7},{"n":20,"stem":"Asexual reproduction in liverworts occurs by :","options":["Zygote","Gemmae formation","Both 1 & 2","Only zoospore formation"],"page":7},{"n":21,"stem":"Which of the following statements regarding Rhodophyceae are correct: I. They are commonly called red algae due to the predominance of phycoerythrin. II. The majority of red algae are marine and are abundant in warmer seas. III. They are found only in shallow, well-lighted waters. IV. Food is stored as floridean starch.","options":["I and II only","I, II and IV only","II, III and IV only","I, II, III and IV"],"page":8},{"n":22,"stem":"Sexual reproduction in Rhodophyceae is characterized by:","options":["Isogamy with motile gametes","Anisogamy with motile gametes","Oogamy with non-motile gametes","Isogamy with non-motile gametes"],"page":8},{"n":23,"stem":"Which of the following statements regarding Rhodophyceae are correct: I. Most red algae have multicellular thalli. II. Some members possess a complex body organisation. III. Floridean starch is structurally similar to amylopectin and glycogen. IV. The dominant photosynthetic pigment is fucoxanthin.","options":["I and II only","II, III and IV only","I, II and III only","I, II, III and IV"],"page":8},{"n":24,"stem":"Statement I: Sporophylls are leaf-like appendages that bear sporangia. Statement II: In some pteridophytes, sporophylls are arranged into compact structures called strobili or cones.","options":["Both Statement I and Statement II are correct.","Statement I is correct, but Statement II is incorrect.","Statement I is incorrect, but Statement II is correct.","Both Statement I and Statement II are incorrect."],"page":9},{"n":25,"stem":"Gemmae in liverworts are:","options":["Motile sexual spores","Female sex organs","Male sex organs","Green, multicellular asexual buds formed in gemma cups"],"page":9},{"n":26,"stem":"Which of the following statements are correct according to moss: A. The gametophyte is the predominant stage in the life cycle of mosses. B. Protonema develops directly from a spore. C. Leafy stage develops directly from the zygote. D. Leafy stage bears the sex organs.","options":["A, B and D only","A and C only","B, C and D only","A, B, C and D"],"page":9},{"n":27,"stem":"Which of the following statements are correct about moss: A. Vegetative reproduction occurs by fragmentation. B. Budding occurs in the secondary protonema. C. Antheridia and archegonia are produced at the apex of leafy shoots. D. Fertilisation directly produces spores.","options":["A, B and C only","A and D only","B, C and D only","A, B, C and D"],"page":9},{"n":28,"stem":"Statement I: Prothallus is the dominant phase in the life cycle of pteridophytes. Statement II: The sporophyte is the dominant phase in pteridophytes.","options":["Both Statement I and Statement II are correct.","Statement I is correct, but Statement II is incorrect.","Statement I is incorrect, but Statement II is correct.","Both Statement I and Statement II are incorrect."],"page":10},{"n":29,"stem":"Which of the following statements are correct about the sporophyte of moss: A. It consists of foot, seta and capsule. B. It develops from the zygote. C. Spores are formed after mitosis. D. In capsule spores form by mitosis","options":["A, B and C only","A and D only","A and B only","A, B, C and D"],"page":10},{"n":30,"stem":"Statement I: Male sex organs in pteridophytes are called archegonia. Statement II: Female sex organs in pteridophytes are called antheridia.","options":["Both Statement I and Statement II are correct.","Statement I is correct, but Statement II is incorrect.","Statement I is incorrect, but Statement II is correct.","Both Statement I and Statement II are incorrect."],"page":10},{"n":31,"stem":"Which of the following statements are correct: A. Sporophyte of mosses is more elaborate than that of liverworts. B. Mosses possess an elaborate mechanism of spore dispersal. C. Funaria, Polytrichum and Sphagnum are mosses. D. The dominant generation in mosses is the sporophyte.","options":["A, B and C only","A and D only","B, C and D only","A, B, C and D"],"page":10},{"n":32,"stem":"Select the correct option for the given diagram a. Vascular tissue present b. Rhizome present c. Strobilus or cone absent d. Sporophyte dominant stage e. True root, stem and leaves present","options":["a, b, c, e are correct","Only a, b are correct","Only a, b, d, e are correct","All"],"page":11},{"n":33,"stem":"Which of the following statements regarding pteridophytes are correct: A. Pteridophytes are the first terrestrial plants to possess vascular tissues. B. They are commonly found in cool, damp and shady places. C. They lack true roots, stems and leaves. D. They are used as medicinal plants and soil binders.","options":["A, B and D only","A and C only","B, C and D only","A, B, C and D"],"page":11},{"n":34,"stem":"Gymnosperms are heterosporous because they produce:","options":["Zoospores and aplanospores","Only megaspores","Ascospores and basidiospores","Microspores and megaspores"],"page":11},{"n":35,"stem":"Which of the following statements are correct about the sporophyte of pteridophytes: A. The sporophyte is the dominant plant body. B. It is differentiated into true root, stem and leaves. C. It possesses well-differentiated vascular tissues. D. It bears antheridia and archegonia at its apex.","options":["A, B and C only","A and D only","B, C and D only","A, B, C and D"],"page":12},{"n":36,"stem":"Which of the following statements are correct: A. Leaves of Selaginella are microphylls. B. Ferns possess macrophylls. C. Sporangia are borne on leaf-like appendages called sporophylls. D. In Selaginella and Equisetum, sporophylls may form compact structures called strobili (cones).","options":["A, B, C and D","A, B and C only","B and D only","A and D only"],"page":12},{"n":37,"stem":"Match List I with List II and choose the correct answer. List I (Class) List II (Example) A. Psilopsida I. Equisetum B. Lycopsida II. Psilotum C. Sphenopsida III. Selaginella D. Pteropsida IV. Adiantum","options":["A-I, B-IV, C-III, D-II","A-III, B-II, C-IV, D-I","A-IV, B-I, C-II, D-III","A-II, B-III, C-I, D-IV"],"page":12},{"n":38,"stem":"Consider the following statements about Gymnosperms: A. In gymnosperms, ovules are not enclosed by an ovary wall. B. The seeds of gymnosperms are naked. C. Gymnosperms include only shrubs. D. Sequoia is one of the tallest tree species.","options":["A, B and D only","A and C only","B and C only","A, B, C and D"],"page":13},{"n":39,"stem":"Which of the following is correctly matched:","options":["Male strobilus - Megasporophylls with ovules","Female strobilus - Microsporangia","Male strobilus - Microsporophylls with microsporangia","Female strobilus - Pollen grains"],"page":13},{"n":40,"stem":"Consider the following statements regarding roots of gymnosperms: A. All gymnosperms possess coralloid roots. B. The root system is generally tap root. C. Pinus has mycorrhizal association. D. Coralloid roots of Cycas are associated with nitrogen-fixing cyanobacteria. Choose the correct statements :","options":["A, B and C only","A and D only","B, C and D only","A, B, C and D"],"page":13},{"n":41,"stem":"Which one of the following statements is correct according to gymnosperm:","options":["In Pinus, male and female cones are borne on different trees.","In Cycas, male cones and megasporophylls are borne on different trees.","The female gametophyte develops outside the megasporangium.","All four megaspores develop into female gametophytes."],"page":13},{"n":42,"stem":"Consider the following statements: A. The stem of Cycas is generally branched. B. Pinus and Cedrus have unbranched stems. C. Leaves of gymnosperms may be simple or compound. D. All gymnosperms have compound leaves. Choose the correct statements :","options":["A, B and C only","A and D only","C only","A, B, C and D"],"page":14},{"n":43,"stem":"Which of the following statements about angiosperms is correct:","options":["Ovules are naked and seeds are not enclosed.","Pollen grains and ovules develop in specialised structures called flowers.","Seeds are enclosed within cones.","Flowers are absent in angiosperms."],"page":14},{"n":44,"stem":"Assertion (A): In gymnosperms, the male and female gametophytes do not have an independent free-living existence. Reason (R): Both gametophytes remain within the sporangia retained on the sporophyte.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":14},{"n":45,"stem":"Consider the following statements about leaves of gymnosperms: A. Needle-like leaves of conifers reduce surface area. B. Thick cuticle helps reduce water loss. C. Sunken stomata help reduce transpiration. D. Pinnate leaves of Cycas are shed every month. Choose the correct statements :","options":["A, B, C and D","A, C and D only","B and D only","A, B and C only"],"page":14},{"n":46,"stem":"Assertion (A): Pollination in gymnosperms is generally aided by air currents. Reason (R): Pollen grains released from the microsporangium are carried by wind to the opening of the ovule.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":15},{"n":47,"stem":"Which of the following is correctly matched:","options":["Smallest angiosperm - Eucalyptus","Tallest angiosperm - Wolffia","Smallest angiosperm - Wolffia; Tall trees - Eucalyptus","Monocotyledons - Seeds not enclosed in fruits"],"page":15},{"n":48,"stem":"Which of the following statements are correct: A. Gymnosperms bear naked seeds. B. Ovules remain exposed before and after fertilisation. C. Sequoia is a angiosperm. D. Conifers possess broad leaves to increase transpiration.","options":["A, B,and C only","A and D only","A, B, C and D","A and B only"],"page":15},{"n":49,"stem":"Assertion (A): The seeds of gymnosperms are naked. Reason (R): After fertilisation, the ovules develop into seeds that are not enclosed by an ovary wall.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":15},{"n":50,"stem":"Select the incorrect match","options":["Microsporophylls – Male cone","Megasporophylls – Female cone","Coralloid roots – N2 - fixing cyanobacteria","Pollen grain – Released from megasporangium"],"page":15},{"n":51,"stem":"Select the correct match for pteridophytes","options":["Protonema stage – Gametophytic stage","Selaginella – Microphylls","Archegoniophore – Marchantia","All"],"page":16},{"n":52,"stem":"Select the incorrect match","options":["Monocotyledons – Angiosperm","Dicotyledons – Angiosperm","Pinus – Double fertilization","Cedrus – Pollen grain"],"page":16},{"n":53,"stem":"Given below are two statements Statement I: Unlike the pteridophytes where the ovules are naked, in the angiosperm or flowering plants, the pollen grains and ovules are developed in specialised structures called flowers. Statement II : In angiosperm seeds are enclosed in fruits. Choose the correct answer from the option given below:","options":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"page":16},{"n":54,"stem":"Which of the following is/are correctly matched ","options":["Ulothrix Isogamous ","Gelidium Oogamous ","Gracilaria Oogamous","All"],"page":16},{"n":55,"stem":"What is cuscuta :","options":["Smallest Bryophytes","Brown algae","Parasitic angiosperm","Smallest Gymnosperm"],"page":16},{"n":56,"stem":"Covered seeds, flower and fruit is the characteristic of","options":["Pteridophytes","Angiosperms","Gymnosperms","All of these"],"page":16},{"n":57,"stem":"Statement -I- The predominant stages of the life cycle of a moss is the gametophyte which consist of two stages. Statement-II- Vegetative reproduction in mosses is by fragmentation and budding in the secondary protonema.","options":["Both Statement I and Statement II are incorrect","Statement I is correct but Statement II is incorrect","Statement I is incorrect but Statement II is correct","Both Statement I and Statement II are correct"],"page":17},{"n":58,"stem":"How many statements are correct with reference to given diagram (a) True root, stem and leaves are present (b) Haploid rhizoid present (c) Thalloid gametophyte protonema present (d) It is heterosporus plants (e) A type of eukaryotes","options":["Three","Four","One","Two"],"page":17},{"n":59,"stem":"Which one of the following are correct statement among, Pinus, Polytrichum and Adiantum a. In all vascular tissue present b. In all embryo present c. In all archegonia present d. In all pollen grain present","options":["a, b, c","a, b, c, d","Only b, c","b, c, e"],"page":17},{"n":60,"stem":"Eucalyptus, Sphagnum, Ginkgo, Sequoia, Polysiphonia, Selaginella, Pteris. How many members have vascular tissue :","options":["6","4","5","3"],"page":17},{"n":61,"stem":"The spores of fern germinate to give rise to inconspicuous, small but multicellular free-living, mostly photosynthetic thalloid body which is :","options":["Gametophytic prothallus","Sporophytic prothallus","Gametophytic strobilus","Gametophytic sporophyll."],"page":18},{"n":62,"stem":"Sunken type of stomata is found in :","options":["Eucalyptus","Mango","Pinus","Neem"],"page":18},{"n":63,"stem":"When macrospores and microspores are germinate then which structure are formed respectively in Pteridophytes :","options":["Male and female gametophyte","Female and male gametophyte","Protonema","Embryo"],"page":18},{"n":64,"stem":"Plant body of Bryophytes attaches to substratum by which structures","options":["Unicellular rhizoids","Multicellular rhizoids","Multicellular rhizophore","Both 1 and 2"],"page":18},{"n":65,"stem":"How many matching are correct a. Isogamous motile - Ulothrix b. Isogamous nonmotile - Eudorina c. Isogamous non motile - Spirogyra d. Anisogamous - Eudorina e. Oogamous - Porphyra","options":["4","3","5","2"],"page":18},{"n":66,"stem":"Which one of the following is odd :","options":["Pollen grain","Microspore","Megasporophylls","Archegonium."],"page":19},{"n":67,"stem":"Which of the following are correct statements between protonema and prothallus : (a) Both are haploid structure (b) Both are gametophyte (c) Both are dominant stage in their respective plants (d) Both are thalloid","options":["a, b, c, d","a, b, d","Only b, d","Only a, d"],"page":19},{"n":68,"stem":"Match the following classification system according to their criterias a. Phylogenetic classification system b. Numerical Taxonomy c. Cytotaxonomy d. Chemotaxonomy (i) based on cytological information i.e. chromosome structure , number and behaviour (ii) based on chemical constituents of the plant (iii) Number and codes are assigned to all characters and data is then processed (iv) based on evolutionary relationships among various organisms","options":["a(iv), b(iii), c(ii), d(i)","a(iv), b(iii), c(i), d(ii)","a(iii), b(iv), c(i), d(ii)","a(iv), b(i), c(ii), d(iii)"],"page":19},{"n":69,"stem":"Volvox, Ulothrix, Spirogyra, Chara, Dictyota, Ectocarpus, Laminaria, Sargassum, Fucus, Porphyra and Polysiphonia, etc., are the examples of plants. Number of plants which having chlorophyll \"a\" and chlorophyll \"d\" are","options":["Three","Four","Two","Five"],"page":19},{"n":70,"stem":"Match the following groups : Group I Group II (a) Algae i- Sphagnum (b) Liverwort ii- Selaginella (c) Moss iii- Sequoia (d) Pteridophyte iv- Porphyra (e) Gymnosperm v- Marchantia","options":["a-iv, b-v, c-i, d-ii, e-iii","a-v, b-iv, c-i, d-ii, e-iii","a-i, b-v, c-ii, d-iii, e-iv","a-iv, b-i, c-iii, d-v, e-ii"],"page":20}, lse),done=false,seconds=10800;const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;$('timer').textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function palette(){let p=$('palette');p.innerHTML='';DATA.forEach((q,i)=>{let b=document.createElement('button');b.className='p'+(ans[i]!=null?' a':'')+(marked[i]?' m':'')+(i===cur?' c':'');b.textContent=q.n;b.onclick=()=>{cur=i;render()};p.appendChild(b)})}function render(){let q=DATA[cur];$('qno').textContent='Question '+q.n;$('state').textContent=ans[cur]==null?(marked[cur]?'Marked for Review':'Unattempted'):(marked[cur]?'Answered • Review':'Answered');$('stem').textContent=q.stem;let o=$('options');o.innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[cur]===i+1?' selected':'');b.innerHTML='<b>('+String(i+1)+')</b> '+esc(v);b.onclick=()=>{if(!done){ans[cur]=i+1;render()}};o.appendChild(b)});$('prev').disabled=cur===0;$('next').disabled=cur===DATA.length-1;palette();window.scrollTo({top:0,behavior:'smooth'})}function submit(){if(done)return;if(!confirm('Submit this test?'))return;done=true;clearInterval(id);show()}async function show(){
 if(done===false)done=true;
 if(id){clearInterval(id);id=null}
 let c=0,w=0,u=0;
 ans.forEach((a,i)=>a==null?u++:(a===KEY[i]?c++:w++));
 const score=c*4-w;
 $('result').innerHTML='<h2>'+TEST+' Result</h2><div class="metrics"><div class="metric"><b>'+score+'</b>Score</div><div class="metric"><b>'+c+'</b>Correct</div><div class="metric"><b>'+w+'</b>Incorrect</div><div class="metric"><b>'+u+'</b>Unattempted</div></div>'+reviewHtml(true)+'<button class="btn secondary" onclick="location.reload()">Reattempt Test</button>';
 $('qcard').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';
 await saveAttempt();
}function reviewHtml(hasKey){const misses=DATA.map((q,i)=>({q,i,a:ans[i],k:hasKey?KEY[i]:null})).filter(x=>x.a==null||(x.k!=null&&x.a!==x.k));const cards=misses.length?misses.map(({q,i,a,k})=>'<div class="ri" style="border-left:4px solid #b91c1c"><b>Q'+q.n+' · '+(a==null?'Unattempted':'Incorrect')+'</b><div style="margin:8px 0">'+esc(q.stem)+'</div><ol style="padding-left:24px">'+q.options.map((o,j)=>'<li style="margin:5px 0;'+(k===j+1?'color:#15803d;font-weight:bold;':a===j+1?'color:#b91c1c;font-weight:bold;':'')+'">'+esc(o)+(a===j+1?' — Your answer':'')+(k===j+1?' — Correct answer':'')+'</li>').join('')+'</ol></div>').join(''):'<p>Great! No incorrect or unattempted questions.</p>';return '<div class="review"><h3>❌ Incorrect & Unattempted Questions ('+misses.length+')</h3><p>Review these questions, your selected option, and the correct answer.</p>'+cards+'<h3>📋 All Questions Review</h3>'+DATA.map((q,i)=>{let a=ans[i],k=hasKey?KEY[i]:null;let cl=hasKey?(a==null?'':a===k?'correct':'wrong'):'';return '<div class="ri"><b>Q'+q.n+'</b><div>'+esc(q.stem)+'</div><div class="small">Your answer: '+(a==null?'Not attempted':'Option '+a)+(k?' • Correct answer: Option '+k:'')+'</div>'+(cl?'<div class="'+cl+'"><b>'+ (cl==='correct'?'Correct':'Incorrect')+'</b></div>':'')+'</div>'}).join('')+'</div>'}let id=null;function startClock(){if(id||done)return;id=setInterval(()=>{if(seconds<=0){seconds=0;clock();done=true;clearInterval(id);id=null;show();return}seconds--;clock()},1000)}function stopClock(){if(id){clearInterval(id);id=null}}window.startExamClock=startClock;window.stopExamClock=stopClock;clock();$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur<DATA.length-1){cur++;render()}};$('clearResponse').onclick=()=>{ans[cur]=null;render()};$('markReview').onclick=()=>{marked[cur]=!marked[cur];render()};$('submit').onclick=submit;render();</script><style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
 const sb=window.supabase.createClient('https://hwndciclhjwicallmtfr.supabase.co','sb_publishable_PAfy8xgj34tNS-SNNmH-eQ_VMEJVAYw');
 const gate=document.getElementById('authGate'),msg=document.getElementById('authMsg');let activeUser=null,saved=false;
 function message(t){msg.textContent=t}
 async function refreshSession(){const {data,error}=await sb.auth.getSession();if(error)message(error.message);if(data.session){activeUser=data.session.user;gate.style.display='none';document.getElementById('authUser').textContent=activeUser.email||'Signed in';document.getElementById('signOutBtn').style.display='inline-block';window.startExamClock&&window.startExamClock()}else{window.stopExamClock&&window.stopExamClock();gate.style.display='flex';document.getElementById('authUser').textContent='';document.getElementById('signOutBtn').style.display='none'}}

 document.getElementById('signUpBtn').onclick=async()=>{message('Creating account…');let {data,error}=await sb.auth.signUp({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPass').value});if(error)message(error.message);else if(data.session){activeUser=data.user;await refreshSession()}else message('Account created. Check your email to confirm, then sign in.')};
 document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();activeUser=null;await refreshSession()};
 window.saveAttempt=async function(){
  if(saved)return;saved=true;
  const total=DATA.length,attempted=ans.filter(a=>a!==null).length,unattempted=total-attempted;
  const hasKey=KEY.length===total;
  const correct=hasKey?ans.reduce((n,a,i)=>n+(a===KEY[i]?1:0),0):null;
  const incorrect=hasKey?attempted-correct:null;
  const score=hasKey?correct*4-incorrect:null;
  const accuracy=hasKey?(attempted?correct/attempted*100:0):null;
  const studentKey=activeUser?.id||'guest';
  const storageKey='aim2aiims_attempts_'+studentKey;
  let localRows=[];try{localRows=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(localRows))localRows=[]}catch(_){localRows=[]}
  let remoteRows=[];
  if(activeUser){
   try{
    const {data,error}=await sb.from('test_attempts').select('test_id,attempt_number,score,correct,incorrect,unattempted,total_questions,accuracy,created_at').eq('user_id',activeUser.id).eq('test_id',TEST).order('attempt_number',{ascending:false}).limit(50);
    if(error)throw error;remoteRows=data||[];
   }catch(e){console.warn('Could not read cloud history:',e.message||e)}
  }
  const maxLocal=localRows.filter(r=>r.test_id===TEST).reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const maxRemote=remoteRows.reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const attempt=Math.max(maxLocal,maxRemote)+1;
  const previous=[...remoteRows,...localRows.filter(r=>r.test_id===TEST)].filter(r=>Number(r.attempt_number)<attempt).sort((a,b)=>Number(b.attempt_number)-Number(a.attempt_number))[0]||null;
  const details=DATA.map((q,i)=>({question_number:q.n,question:q.stem,options:q.options,selected_option:ans[i],correct_option:hasKey?KEY[i]:null,marked_for_review:!!marked[i],status:ans[i]==null?'unattempted':!hasKey?'answered':ans[i]===KEY[i]?'correct':'incorrect'}));
  const record={test_id:TEST,test_name:TEST,attempt_number:attempt,created_at:new Date().toISOString(),total_questions:total,attempted,correct,incorrect,unattempted,score,accuracy,question_details:details,student_id:activeUser?.id||null,storage:'local'};
  localRows.push(record);
  try{localStorage.setItem(storageKey,JSON.stringify(localRows))}catch(e){console.warn('Local result storage failed:',e)}
  let cloudSaved=false,cloudError='';
  if(activeUser){
   try{
    const {error}=await sb.from('test_attempts').insert({user_id:activeUser.id,test_id:TEST,test_name:TEST,total_questions:total,attempted,correct,incorrect,unattempted,score,accuracy,attempt_number:attempt,question_details:details});
    if(error)throw error;cloudSaved=true;record.storage='local+cloud';
    localRows[localRows.length-1]=record;localStorage.setItem(storageKey,JSON.stringify(localRows));
   }catch(e){cloudError=e.message||String(e);console.warn('Cloud result save failed:',cloudError)}
  }
  const priorScore=previous&&previous.score!==null&&previous.score!==undefined?Number(previous.score):null;
  const delta=score!==null&&priorScore!==null?score-priorScore:null;

  if(previous){
   if(delta!==null)html+='<p><b>Previous attempt:</b> '+(priorScore)+' marks · <b>Change:</b> '+(delta>0?'+':'')+delta+' marks '+(delta>0?'📈':delta<0?'📉':'↔️')+'</p>';
   else html+='<p>Previous attempt #'+previous.attempt_number+' found; score comparison unavailable because a scored answer key is not available.</p>';

  html+='<h4>Recent attempts</h4><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Attempt</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Date</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Marks</th></tr></thead><tbody>';

  box.innerHTML=html;$('result').appendChild(box);
 };
 sb.auth.onAuthStateChange((_event,session)=>{activeUser=session?.user||null;refreshSession()});refreshSession();
})();
