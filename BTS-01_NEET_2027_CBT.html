:14px}.legend{font-size:11px;color:var(--muted);margin:8px 0 12px}.result{display:none;padding:20px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{text-align:center;background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:10px}.metric b{font-size:28px;display:block}.review{margin-top:18px}.ri{padding:13px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.correct{color:#15803d}.wrong{color:#b91c1c}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.stem{font-size:17px}.metrics{grid-template-columns:repeat(2,1fr)}.timer{font-size:18px}}</style></head><body><header><div class="top"><div><div class="brand">AIM2AIIMS RISHIKESH</div><div class="sub">NEET 2027 • BTS-01 • Interactive CBT</div></div><div class="timer" id="timer">03:00:00</div></div></header><div class="wrap"><div class="layout" id="exam"><main><section class="card qcard" id="qcard"><div class="qtitle"><strong id="qno">Question 1</strong><span id="state">Unattempted</span></div><div class="stem" id="stem"></div><div class="options" id="options"></div><div class="controls"><button class="btn secondary" id="prev">← Previous</button><button class="btn secondary" id="clearResponse">Clear Response</button><button class="btn secondary" id="markReview">Mark for Review</button><button class="btn primary" id="next">Next →</button></div></section><section class="card result" id="result"></section></main><aside class="card side"><h3>Question Palette</h3><div class="legend">Green = answered • Yellow = review • Blue outline = current</div><div class="palette" id="palette"></div><button class="btn primary submit" id="submit">Submit Test</button></aside></div></div><script>const DATA=[{"n":1,"stem":"Ernst Mayr is best known for pioneering which of the following:","options":["Cell theory","Biological species concept","Chromosomal theory of inheritance","Germplasm theory"],"page":3},{"n":2,"stem":"Which of the following awards was NOT among the \"Triple Crown of Biology\" received by Ernst Mayr:","options":["Balzan Prize","International Prize for Biology","Crafoord Prize","Nobel Prize"],"page":3},{"n":3,"stem":"Match the Award with the Year. List I List II A. Balzan Prize I. 1994 B. International Prize II. 1983 for biology C. Crafoord Prize III. Triple Crown of Biology D. All three IV. 1999 awards together","options":["AII, BIV, CI, DIII","AI, BII, CIII, DIV","AIV, BIII, CII, DI","AII, BI, CIV, DIII"],"page":3},{"n":4,"stem":"The number of known and described species on Earth is approximately:","options":["0.50.8 million","1.01.2 million","1.71.8 million","3.54.0 million"],"page":3},{"n":5,"stem":"Consider the following statements regarding Binomial Nomenclature: A. Each scientific name has two components. B. The two components are the generic name and the specific epithet. C. Binomial nomenclature was introduced by Carolus Linnaeus. D. The scientific name of mango is Mangifera indica. Choose the correct statments","options":["A, B and C only","B, C and D only","A, B, C and D","A and D only"],"page":3},{"n":6,"stem":"The process of assigning a standard scientific name to an organism is called:","options":["Classification","Identification","Nomenclature","Taxonomy"],"page":4},{"n":7,"stem":"Which of the following is essential before assigning a scientific name to an organism:","options":["Preservation","Correct identification and description","Collection of fossils","Hybridisation"],"page":4},{"n":8,"stem":"Consider the following statements about the scientific name Mangifera indica: A. Mangifera represents the genus. B. indica is the specific epithet. C. The genus name starts with a capital letter. D. The specific epithet starts with a capital letter. Choose the correct statments","options":["A and B only","A, B and C only","B, C and D only","A, B, C and D"],"page":4},{"n":9,"stem":"Match the following codes of nomenclature with their corresponding organism groups: A. ICBN B. ICZN","options":["AAnimals, BPlants","APlants, BAnimals","AFungi, BBacteria","AProtists, BViruses"],"page":4},{"n":10,"stem":"Statement I: Taxonomy is the process of classifying living organisms into different taxa. Statement II: Characterisation, identification, classification and nomenclature are the basic processes of taxonomy.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":4},{"n":11,"stem":"Consider the following statements according to binomial nomenclature: A. The author's name is written after the specific epithet in abbreviated form. B. Mangifera indica Linn. indicates that the species was first described by Linnaeus. C. The author's name is written before the genus name. D. The author's name is not a part of the binomial name. Choose the correct statments","options":["A, B, C and D","A and C only","B and D only","A, B and D only"],"page":5},{"n":12,"stem":"Which of the following best distinguishes taxonomy from systematics:","options":["Taxonomy deals only with naming, whereas systematics deals only with classification.","Taxonomy includes identification, nomenclature and classification, whereas systematics also considers evolutionary relationships.","Taxonomy studies fossils only, whereas systematics studies living organisms only.","Taxonomy and systematics are exactly the same."],"page":5},{"n":13,"stem":"Match List I with List II. List I List II A. Viroid 1. Free RNA lacking protein coat B. Prion 2. Abnormally folded infectious protein C. Lichen 3. Symbiotic association of algae and fungi D. Phycobiont 4. Autotrophic partner","options":["A1, B2, C3, D4","A2, B1, C4, D3","A1, B3, C2, D4","A4, B2, C3, D1"],"page":5},{"n":14,"stem":"Statement I: Modern taxonomic studies are based only on external morphology of organisms. Statement II: Modern taxonomy considers only internal structure, cell structure, developmental processes and ecological information.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":6},{"n":15,"stem":"Match ListI with ListII. ListI (Organism) ListII (Genus) A. Man I. Mangifera B. Housefly II. Musca C. Mango III. Homo D. Wheat IV. Triticum","options":["AIII, BII, CI, DIV","AII, BIII, CIV, DI","AIV, BI, CIII, DII","AI, BIV, CII, DIII"],"page":6},{"n":16,"stem":"Which of the following statements regarding classification are correct: A. Classification is the process of grouping organisms into convenient categories. B. Classification is based on easily observable characters. C. Classification makes the study of living organisms easier. D. Classification is the same as nomenclature.","options":["A, B, C and D","A and D only","B, C and D only","A, B and C only"],"page":6},{"n":17,"stem":"Which one of the following represents the correct order of decreasing similarities among organisms:   ","options":["Order Family Genus Species   ","Species Genus Family Order   ","Family Species Genus Order   ","Genus Species Family Order"],"page":6},{"n":18,"stem":"A student says that Panthera leo and Panthera tigris belong to different species but the same genus. Which of the following best explains this statement:","options":["They have the same specific epithet but different genera.","They have different genera but belong to the same family.","They have the same genus because they share fundamental morphological similarities, but different specific epithets indicate different species.","They belong to the same species because both are wild cats."],"page":7},{"n":19,"stem":"Which one of the following belongs to the family Felidae:","options":["Dog","Wolf","Tiger","Fox"],"page":7},{"n":20,"stem":"Which of the following statements correctly explains the relationship between genus and species:","options":["A genus always contains only one species.","Different species placed in the same genus share fundamental morphological similarities.","A species is a higher taxonomic category than a genus.","The specific epithet alone is sufficient to identify an organism scientifically."],"page":7},{"n":21,"stem":"Consider the following statements about taxa: A. Taxa are convenient categories used to study organisms. B. Taxa exist at different hierarchical levels. C. 'Animals', 'Mammals' and 'Dogs' represent taxa at different levels. D. 'Wheat' is not considered a taxon. Choose the correct statments","options":["A and B only","A, B and C only","B, C and D only","A, B, C and D"],"page":7},{"n":22,"stem":"Match ListI with ListII. ListI (Organism) ListII (Family) A. Man I. Poaceae B. Housefly II. Muscidae C. Mango III. Hominidae D. Wheat IV. Anacardiaceae","options":["AIII, BII, CIV, DI","AII, BI, CIII, DIV","AIV, BIII, CII, DI","AI, BIV, CII, DIII"],"page":8},{"n":23,"stem":"Panthera leo, Panthera pardus and Panthera tigris are placed in the same genus because they:","options":["Have the same specific epithet.","Share more common characters with each other than with species of other genera.","Belong to the same family only.","Are all domesticated animals."],"page":8},{"n":24,"stem":"Which of the following correctly matches the taxonomic category with its description:","options":["Family Group of related orders","Order Group of related classes","Genus Group of closely related species","Species Group of related genera"],"page":8},{"n":25,"stem":"Statement I: Systematics includes the study of evolutionary relationships among organisms. Statement II: The word systematics is derived from the Latin word systema, meaning systematic arrangement of organisms.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":8},{"n":26,"stem":"Assertion (A): Species is considered the lowest taxonomic category in both the plant and animal kingdoms. Reason (R): All organisms that belong to the same kingdom also belong to the same species.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"page":9},{"n":27,"stem":"Match ListI with ListII. ListI (Organism) ListII (Order) A. Man I. Poales B. Housefly II. Diptera C. Mango III. Primata D. Wheat IV. Sapindales","options":["AI, BIV, CIII, DII","AII, BIII, CI, DIV","AIV, BI, CII, DIII","AIII, BII, CIV, DI"],"page":9},{"n":28,"stem":"Which of the following pairs belongs to different families:","options":["Lion and Leopard","Tiger and Cat","Cat and Dog","Potato and Brinjal"],"page":9},{"n":29,"stem":"Plant families Solanaceae and Convolvulaceae are placed in the same order mainly on the basis of:","options":["Root characters only","Stem characters only","Floral characters","Leaf venation only"],"page":9},{"n":30,"stem":"Which of the following statements is correct with reference to given diagram","options":["It is a type of multicellular organism","It is a type of heterotrophic organism","It is a type of Eukaryotic organism","All"],"page":10},{"n":31,"stem":"Which one of the following taxonomic categories is an assemblage of families that exhibit a few similar characters:","options":["Species","Genus","Family","Order"],"page":10},{"n":32,"stem":"As we move from species to kingdom in the taxonomic hierarchy:","options":["The number of common characteristics increases.","The number of common characteristics decreases.","The number of species decreases.","Organisms become genetically identical."],"page":10},{"n":33,"stem":"Which one of the following sequences represents the correct ascending taxonomic hierarchy:     ","options":["Species Genus Family Order Class  Phylum/Division Kingdom    ","Kingdom Phylum Class Order Family   Genus Species     ","Species Family Genus Order Class  Kingdom Phylum     ","Genus Species Family Order Class  Phylum Kingdom"],"page":10},{"n":34,"stem":"Which of the following common features is responsible for placing animals in the phylum Chordata:","options":["Presence of jointed appendages and exoskeleton","Presence of chlorophyll and cell wall","Presence of wings and feathers","Presence of notochord and dorsal hollow nerve cord"],"page":10},{"n":35,"stem":"Why does classification become more complex at higher taxonomic categories:","options":["Higher taxa contain fewer organisms.","Members of higher taxa share more characteristics.","Determining relationships among taxa becomes more difficult as common characteristics decrease.","Species lose their scientific names at higher levels."],"page":11},{"n":36,"stem":"Match ListI with ListII. ListI (Organism) ListII (Phylum/Division) A. Man I. Arthropoda B. Housefly II. Angiospermae C. Mango III. Chordata D. Wheat IV. Angiospermae","options":["AIV, BII, CIII, DI","AI, BIII, CIV, DII","AII, BIV, CI, DIII","AIII, BI, CII, DIV"],"page":11},{"n":37,"stem":"Which one of the following was the main limitation of Linnaeus' Two Kingdom classification:","options":["It separated prokaryotes from eukaryotes.","It distinguished unicellular from multicellular organisms.","It failed to distinguish between prokaryotes and eukaryotes, unicellular and multicellular organisms, and photosynthetic and nonphotosynthetic organisms.","It included only microorganisms."],"page":11},{"n":38,"stem":"Aristotle classified animals into two groups mainly on the basis of:","options":["Habitat (aquatic and terrestrial)","Presence or absence of red blood","Mode of nutrition","Presence or absence of a backbone"],"page":11},{"n":39,"stem":"Which of the following characteristics were later included to make biological classification more scientific: A. Cell structure B. Nature of cell wall C. Mode of nutrition D. Evolutionary relationships","options":["A and B only","A, B and C only","B, C and D only","A, B, C and D"],"page":11},{"n":40,"stem":"Match ListI with ListII. ListI (Kingdom) ListII (Characteristic) A. Monera I. Cell wall made of chitin B. Protista II. Cell wall absent C. Fungi III. Prokaryotic cell D. Plantae IV. Cell wall present with cellulose E. Animalia V. Eukaryotic; cell wall present in some members","options":["AIII, BV, CI, DIV, EII","AI, BII, CIII, DV, EIV","AIII, BI, CV, DII, EIV","AIV, BV, CI, DIII, EII"],"page":12},{"n":41,"stem":"Consider the following statements regarding Whittaker's Five Kingdom Classification: A. R.H. Whittaker proposed the Five Kingdom Classification in 1979. B. The five kingdoms are Monera, Protista, Fungi, Plantae and Animalia. C. Cell structure, body organisation, mode of nutrition, reproduction and phylogenetic relationships were the main criteria used for classification. D. The Five Kingdom Classification was proposed by Carolus Linnaeus. Choose the correct statments","options":["A, B and C only","B and C only","B, C and D only","A, B, C and D"],"page":12},{"n":42,"stem":"Assertion (A): In two kingdom classification systems placed bacteria, cyanobacteria, fungi and green plants under Kingdom Plantae. Reason (R): The common character used to unite them was the presence of a cell wall.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"page":12},{"n":43,"stem":"Which of the following statements regarding the ThreeDomain System are correct: A. It divides Kingdom Monera into two domains. B. The remaining eukaryotic kingdoms are placed in the third domain. C. It results in a sixkingdom classification. D. It was proposed by R.H. Whittaker in 1969.","options":["A and B only","A, B and C only","B, C and D only","A, B, C and D"],"page":13},{"n":44,"stem":"Match ListI with ListII. ListI ListII (Kingdom) (Mode of Nutrition) A. Monera I. Heterotrophic (Holozoic/Saprophytic etc.) B. Protista II. Autotrophic (Photosynthetic) C. Fungi III. Autotrophic (Chemosynthetic/ Photosynthetic) and Heterotrophic D. Plantae IV. Heterotrophic (Saprophytic/ Parasitic) E. Animalia V. Autotrophic (Photosynthetic) and Heterotrophic","options":["AI, BII, CIV, DIII, EV","AII, BIV, CIII, DV, EI","AIV, BIII, CI, DII, EV","AIII, BV, CIV, DII, EI"],"page":13},{"n":45,"stem":"Consider the following statements about the limitations of earlier classification systems: A. Two kingdom system grouped bacteria and cyanobacteria with plants because all possessed a cell wall. B. They failed to distinguish between prokaryotic and eukaryotic organisms. C. They grouped unicellular and multicellular algae together. D. They differentiated fungi from green plants on the basis of mode of nutrition and cell wall composition. Choose the correct statments","options":["A, B and C only","A, C and D only","B and D only","A, B, C and D"],"page":14},{"n":46,"stem":"Assertion (A): The Two Kingdom Classification was found to be inadequate. Reason (R): It failed to distinguish between prokaryotes and eukaryotes, unicellular and multicellular organisms, and autotrophs and heterotrophs.","options":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, but R is false","A is false, but R is true"],"page":14},{"n":47,"stem":"Which of the following changes in classification led to the separation of fungi from Kingdom Plantae:","options":["Fungi possess chlorophyll, whereas green plants do not.","Fungi are heterotrophic with chitinous cell walls, whereas green plants are autotrophic with cellulosic cell walls.","Fungi are prokaryotic, whereas green plants are eukaryotic.","Fungi lack a cell wall, whereas green plants possess a cell wall."],"page":14},{"n":48,"stem":"Which of the following organisms were brought together under Kingdom Protista in Whittaker's classification: A. Chlamydomonas B. Chlorella C. Paramecium D. Amoeba","options":["A and B only","C and D only","A, B, C and D","A, C and D only"],"page":15},{"n":49,"stem":"Which of the following is correctly matched:","options":["Bladderwort Total parasitic plant","Cuscuta Insectivorous plant","Venus flytrap Insectivorous plant","Algae Prokaryotic organism"],"page":15},{"n":50,"stem":"Why did organisms that were earlier placed in different kingdoms come together in Kingdom Protista in Whittaker's classification:","options":["Because all protists are multicellular organisms.","Because the criteria used for classification changed with improved understanding of organismal characteristics and evolutionary relationships.","Because all protists possess cellulose cell walls.","Because all protists are autotrophic."],"page":15},{"n":51,"stem":"Consider the following statements: A. Fungi are heterotrophic organisms. B. Fungi are cosmopolitan in distribution. C. Fungi prefer to grow in warm and humid places. D. All fungi are unicellular. Choose the correct option :","options":["A, B, C and D are correct","A and C only are correct","B and D only are correct","A, B and C are correct"],"page":15},{"n":52,"stem":"Assertion (A): Dinoflagellates are mostly marine Reason (R): They contain pigments that may make them appear yellow, green, brown, blue or red.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":16},{"n":53,"stem":"Assertion (A): The cell wall of dinoflagellates contains stiff cellulose plates on the inner surface. Reason (R): These cellulose plates form the inner side of the cell.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A and R both are false."],"page":16},{"n":54,"stem":"Consider the following statements about fungal hyphae: A. Hyphae are long, slender, threadlike structures. B. The network of hyphae is called mycelium. C. Coenocytic hyphae contain multinucleate cytoplasm. D. All hyphae possess septa. Choose the correct option :","options":["A and B only are correct","A, B and C are correct","C and D only are correct","A, B, C and D are correct"],"page":16},{"n":55,"stem":"Consider the following statements: A. Yeast is a unicellular fungus. B. Penicillium is a source of antibiotics. C. Puccinia causes wheat rust disease. D. Mushroom is a parasitic fungus. Choose the correct option :","options":["B, C and D are correct","A and D only are correct","A, B and C are correct","All are correct"],"page":16},{"n":56,"stem":"Assertion (A): All dinoflagellates possess two flagella. Reason (R): One flagellum lies longitudinally, while the other lies transversely in a furrow between the wall plates.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":17},{"n":57,"stem":"Consider the following statements regarding nutrition in fungi: A. Saprophytes absorb soluble organic matter from dead substrates. B. Parasites depend on living plants and animals. C. Some fungi live as symbionts. D. All fungi are autotrophs. Choose the correct option :","options":["A, B and C are correct","A and D only are correct","B and C only are correct","All are correct"],"page":17},{"n":58,"stem":"Consider the following statements: A. The fungal cell wall is made of chitin and polysaccharides. B. Lichens are an association between fungi and Archaebacteria. C. Mycorrhiza is an association between fungi and roots of higher plants. D. Fungi synthesize their own food by photosynthesis. Choose the correct option :","options":["B and D only are correct","A and C only are correct","A, B and C are correct","All are correct"],"page":17},{"n":59,"stem":"Consider the following statements regarding bacteria: A. Bacteria are the sole members of Kingdom Monera. B. Bacteria are the most abundant microorganisms. C. Bacteria are absent from extreme habitats such as hot springs and deep oceans. D. Some bacteria live as parasites on or in other organisms. Choose the correct option :","options":["B, C and D are correct","A and C only are correct","A, B and D are correct","All are correct"],"page":18},{"n":60,"stem":"Consider the following statements regarding bacterial shape: A. Coccus is spherical in shape. B. Bacillus is rodshaped. C. Vibrio is commashaped. D. Spirillum is spiralshaped. Choose the correct option :","options":["A, B and C only are correct","B, C and D only are correct","A, C and D only are correct","A, B, C and D are correct"],"page":18},{"n":61,"stem":"Which of the following characteristics is NOT associated with Mycoplasma:","options":["Complete absence of a cell wall","Smallest living cells known","Can survive without oxygen","Presence of a rigid cell wall"],"page":18},{"n":62,"stem":"Chrysophytes include which of the following:","options":["Diatoms and Desmids","Euglena and Amoeba","Paramecium and Plasmodium","Slime moulds and Yeast"],"page":18},{"n":63,"stem":"Consider the following statements regarding the plant life cycle: A. Plants show alternation of generations. B. The life cycle includes a diploid sporophytic phase and a haploid gametophytic phase. C. The relative duration and independence of these phases are the same in all plant groups. Which of the above statements is/are correct:","options":["A and B only","B and C only","A and C only","A, B and C"],"page":19},{"n":64,"stem":"Consider the following statements regarding bacterial nutrition: A. Some bacteria are heterotrophs, B. Some bacteria are chemosynthetic autotrophs. C. The vast majority of bacteria are photosynthetic autotrophs.. D. All bacteria depend on dead organic matter for food. Choose the correct option :","options":["Only A and B are correct","A, B and C are correct","Only B is correct","All are correct"],"page":19},{"n":65,"stem":"Statement I: Deuteromycetes reproduce by conidia, and their mycelium is branched and septate. Statement II: Most members of Deuteromycetes are obligate autotrophs that do not participate in mineral cycling.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":19},{"n":66,"stem":"Which of the following pair is correctly matched:","options":["Halophiles Marshy areas","Methanogens Hot springs","Thermoacidophiles Hot acidic springs","Cyanobacteria Heterotrophic decomposers"],"page":20},{"n":67,"stem":"Which statement regarding cyanobacteria is INCORRECT:","options":["They possess chlorophyll a.","They are photosynthetic autotrophs.","They have specialised nitrogenfixing cells called heterocysts.","They lack a rigid cell wall."],"page":20},{"n":68,"stem":"Which of the following bacteria obtain energy by oxidising inorganic substances such as ammonia, nitrites :","options":["Heterotrophic bacteria","Cyanobacteria","Chemosynthetic autotrophic bacteria","Methanogens"],"page":20},{"n":69,"stem":"Assertion (A): Red tides can be harmful to marine life. Reason (R): Toxins released by large numbers of red dinoflagellates may kill other marine animals such as fishes.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":20},{"n":70,"stem":"Find correct option regarding this diagram: (a) Colour of this organism appear as yellow, brown blue and red but not green. (b) Releases toxins that kills fishes and other marine animal (c) Two flagella differ in their position (d) Cell wall is made of peptidoglycan.","options":["a, b","b and c","a, b and c","b, c, and d"],"page":21},{"n":71,"stem":"Diatomaceous earth is formed by the accumulation of:","options":["Dead protozoans","Silicarich cell walls of diatoms","Fungal spores","Algal pigments"],"page":21},{"n":72,"stem":"Which of the following combinations is correct for Kingdom Animalia:","options":["Prokaryotic Autotrophic Cell wall present","Eukaryotic Heterotrophic Cell wall absent","Eukaryotic Autotrophic Cell wall absent","Prokaryotic Heterotrophic Cell wall present"],"page":21},{"n":73,"stem":"Which of the following is NOT a use of diatomaceous earth:","options":["Polishing","Filtration of oils and syrups","Manufacture of antibiotics","Abrasive material due to its gritty nature"],"page":21},{"n":74,"stem":"Which one of the following statements is INCORRECT:","options":["Bacteria reproduce mainly by binary fission.","Under unfavourable conditions, bacteria may produce spores.","Bacteria reproduce sexually by the formation of male and female gametes.","Bacteria can exchange DNA through a primitive type of DNA transfer."],"page":22},{"n":75,"stem":"Assertion (A): Archaebacteria can survive in extreme habitats such as hot springs and highly saline areas. Reason (R): Their unique cell wall structure helps them tolerate extreme environmental conditions.","options":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"page":22},{"n":76,"stem":"Consider the following statements regarding viruses: A. Viruses are obligate intracellular parasites. B. Viruses are inert outside their specific host cell. C. Every virus contains both RNA and DNA as genetic material. D. W.M. Stanley demonstrated that viruses could be crystallised. Choose the correct answer:","options":["A, B and D only","A and C only","B, C and D only","A, B, C and D"],"page":22},{"n":77,"stem":"Why are diatoms considered ecologically important:","options":["They are major decomposers.","They are chief producers in the oceans.","They fix atmospheric nitrogen.","They cause harmful algal blooms only."],"page":23},{"n":78,"stem":"Consider the following statements: A. Dmitri Ivanowsky (1892) recognised the causal agent of tobacco mosaic disease. B. M.W. Beijerinck named the pathogen \"virus\" and described it as Contagium vivum fluidum. C. Viruses remain metabolically active outside the host cell. D. Virus means \"venom\" or \"poisonous fluid.\" Choose the correct answer:","options":["B, C and D only","A and C only","A, B and D only","A, B, C and D"],"page":23},{"n":79,"stem":"Which statement about Euglena is correct:","options":["It is always heterotrophic.","It is photosynthetic in sunlight but becomes heterotrophic in the absence of sunlight.","It has no flagella.","It is exclusively marine."],"page":23},{"n":80,"stem":"Statement I: Deuteromycetes are called imperfect fungi Statement II: When the sexual stage of a deuteromycete is discovered, it is often transferred to Ascomycetes or Basidiomycetes.","options":["Both Statement I and Statement II are true","Both Statement I and Statement II are false","Statement I is true, but Statement II is false","Statement I is false, but Statement II is true"],"page":23},{"n":81,"stem":"Slime moulds are best described as:","options":["Parasitic protists","Saprophytic protists","Autotrophic protists","Chemosynthetic protists"],"page":24},{"n":82,"stem":"During unfavourable conditions, the plasmodium of slime moulds forms:","options":["Zoospores","Fruiting bodies bearing spores","Gametes","Cysts without spores"],"page":24},{"n":83,"stem":"Which of the following is NOT a characteristic of slime mould spores:","options":["They possess true walls.","They are highly resistant.","They are dispersed by air currents.","They are dispersed only by water currents."],"page":24},{"n":84,"stem":"Match List I with List II. ListI List II A. Protozoans I. Heterotrophs B. Amoeboid II. Fresh water, sea protozoans water or moist soil C. Food capture III. Pseudopodia D. Paramoecium IV. Ciliated protozoans","options":["AI, BII, CIII, DIV","AII, BIV, CI, DIII","AIV, BI, CII, DIII","AIII, BII, CIV, DI"],"page":24},{"n":85,"stem":"Arrange the following events in fungi with a dikaryotic stage: A. Plasmogamy B. Dikaryophase (n+n) C. Karyogamy D. Fruiting body formation E. Meiosis    ","options":["B A C E D    ","A C B D E    ","A B C D E    ","A B D C E"],"page":24},{"n":86,"stem":"Which one of the following is NOT an asexual spore of fungi:","options":["Conidium","Zoospore","Sporangiospore","Ascospore"],"page":25},{"n":87,"stem":"Which one of the following is NOT a sexual spore of fungi:","options":["Oospore","Basidiospore","Ascospore","Conidium"],"page":25},{"n":88,"stem":"Match List I with List II. List I List II A. T.O. Diener 1. Discovered viroid B. Potato spindle 2. Caused by viroid tuber disease C. BSE 3. Mad cow disease D. CJD 4. Human prion disease","options":["A1, B3, C2, D4","A2, B1, C4, D3","A1, B2, C3, D4","A4, B2, C1, D3"],"page":25},{"n":89,"stem":"Asexual reproduction in Phycomycetes occurs by:","options":["Conidia only","Zoospores or aplanospores produced endogenously in sporangia","Ascospores only","Basidiospores only"],"page":25},{"n":90,"stem":"Consider the following statements regarding viral structure: A. Most plant viruses possess singlestranded RNA. B. Animal viruses may possess singlestranded RNA, doublestranded RNA or doublestranded DNA. C. Bacteriophages are usually doublestranded DNA viruses. D. Capsomeres are the infectious genetic material of viruses. Choose the correct answer:","options":["A and C only","A, B and C only","B, C and D only","A, B, C and D"],"page":25}];const KEY=[2,4,4,3,3,3,2,2,2,1,4,2,1,2,1,4,2,3,3,2,2,1,2,3,1,3,4,3,3,4,4,2,1,4,3,4,3,2,4,1,2,1,2,4,1,1,2,3,3,2,4,2,4,2,3,4,1,2,3,4,4,1,1,3,3,3,4,3,1,2,2,2,3,3,1,1,2,3,2,1,2,2,4,1,3,4,4,3,2,2];const TEST='BTS-01';let cur=0,ans=Array(DATA.length).fill(null),marked=Array(DATA.length).fill(false),done=false,seconds=10800;const $=x=>document.getElementById(x);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clock(){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;$('timer').textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}function palette(){let p=$('palette');p.innerHTML='';DATA.forEach((q,i)=>{let b=document.createElement('button');b.className='p'+(ans[i]!=null?' a':'')+(marked[i]?' m':'')+(i===cur?' c':'');b.textContent=q.n;b.onclick=()=>{cur=i;render()};p.appendChild(b)})}function render(){let q=DATA[cur];$('qno').textContent='Question '+q.n;$('state').textContent=ans[cur]==null?(marked[cur]?'Marked for Review':'Unattempted'):(marked[cur]?'Answered • Review':'Answered');$('stem').textContent=q.stem;let o=$('options');o.innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt'+(ans[cur]===i+1?' selected':'');b.innerHTML='<b>('+String(i+1)+')</b> '+esc(v);b.onclick=()=>{if(!done){ans[cur]=i+1;render()}};o.appendChild(b)});$('prev').disabled=cur===0;$('next').disabled=cur===DATA.length-1;palette();window.scrollTo({top:0,behavior:'smooth'})}function submit(){if(done)return;if(!confirm('Submit this test?'))return;done=true;clearInterval(id);show()}async function show(){
 if(done===false)done=true;
 if(id){clearInterval(id);id=null}
 let c=0,w=0,u=0;
 ans.forEach((a,i)=>a==null?u++:(a===KEY[i]?c++:w++));
 const score=c*4-w;
 $('result').innerHTML='<h2>'+TEST+' Result</h2><div class="metrics"><div class="metric"><b>'+score+'</b>Score</div><div class="metric"><b>'+c+'</b>Correct</div><div class="metric"><b>'+w+'</b>Incorrect</div><div class="metric"><b>'+u+'</b>Unattempted</div></div>'+reviewHtml(true)+'<button class="btn secondary" onclick="location.reload()">Reattempt Test</button>';
 $('qcard').style.display='none';document.querySelector('.side').style.display='none';$('result').style.display='block';
 await saveAttempt();
}function reviewHtml(hasKey){const misses=DATA.map((q,i)=>({q,i,a:ans[i],k:hasKey?KEY[i]:null})).filter(x=>x.a==null||(x.k!=null&&x.a!==x.k));const cards=misses.length?misses.map(({q,i,a,k})=>'<div class="ri" style="border-left:4px solid #b91c1c"><b>Q'+q.n+' · '+(a==null?'Unattempted':'Incorrect')+'</b><div style="margin:8px 0">'+esc(q.stem)+'</div><ol style="padding-left:24px">'+q.options.map((o,j)=>'<li style="margin:5px 0;'+(k===j+1?'color:#15803d;font-weight:bold;':a===j+1?'color:#b91c1c;font-weight:bold;':'')+'">'+esc(o)+(a===j+1?' — Your answer':'')+(k===j+1?' — Correct answer':'')+'</li>').join('')+'</ol></div>').join(''):'<p>Great! No incorrect or unattempted questions.</p>';return '<div class="review"><h3>❌ Incorrect & Unattempted Questions ('+misses.length+')</h3><p>Review these questions, your selected option, and the correct answer.</p>'+cards+'<h3>📋 All Questions Review</h3>'+DATA.map((q,i)=>{let a=ans[i],k=hasKey?KEY[i]:null;let cl=hasKey?(a==null?'':a===k?'correct':'wrong'):'';return '<div class="ri"><b>Q'+q.n+'</b><div>'+esc(q.stem)+'</div><div class="small">Your answer: '+(a==null?'Not attempted':'Option '+a)+(k?' • Correct answer: Option '+k:'')+'</div>'+(cl?'<div class="'+cl+'"><b>'+ (cl==='correct'?'Correct':'Incorrect')+'</b></div>':'')+'</div>'}).join('')+'</div>'}let id=null;function startClock(){if(id||done)return;id=setInterval(()=>{if(seconds<=0){seconds=0;clock();done=true;clearInterval(id);id=null;show();return}seconds--;clock()},1000)}function stopClock(){if(id){clearInterval(id);id=null}}window.startExamClock=startClock;window.stopExamClock=stopClock;clock();$('prev').onclick=()=>{if(cur>0){cur--;render()}};$('next').onclick=()=>{if(cur<DATA.length-1){cur++;render()}};$('clearResponse').onclick=()=>{ans[cur]=null;render()};$('markReview').onclick=()=>{marked[cur]=!marked[cur];render()};$('submit').onclick=submit;render();</script><style>
#authGate{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#071a3b,#174d8c);display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,sans-serif}#authBox{background:#fff;color:#17243b;width:min(420px,100%);padding:26px;border-radius:18px;box-shadow:0 20px 70px #0005}#authBox h2{margin-top:0}#authBox input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}#authBox button{width:100%;margin-top:9px;padding:12px;border:0;border-radius:9px;background:#1769d2;color:#fff;font-weight:800;font-size:15px}#authBox button.alt{background:#e8eef7;color:#18365f}#authMsg{font-size:13px;color:#b42318;line-height:1.4;margin-top:10px}#authTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#authUser{font-size:12px;opacity:.9}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
 const sb=window.supabase.createClient('https://hwndciclhjwicallmtfr.supabase.co','sb_publishable_PAfy8xgj34tNS-SNNmH-eQ_VMEJVAYw');
 const gate=document.getElementById('authGate'),msg=document.getElementById('authMsg');let activeUser=null,saved=false;
 function message(t){msg.textContent=t}
 async function refreshSession(){const {data,error}=await sb.auth.getSession();if(error)message(error.message);if(data.session){activeUser=data.session.user;gate.style.display='none';document.getElementById('authUser').textContent=activeUser.email||'Signed in';document.getElementById('signOutBtn').style.display='inline-block';window.startExamClock&&window.startExamClock()}else{window.stopExamClock&&window.stopExamClock();gate.style.display='flex';document.getElementById('authUser').textContent='';document.getElementById('signOutBtn').style.display='none'}}
 document.getElementById('signInBtn').onclick=async()=>{message('Signing in…');let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPass').value});if(error)message(error.message);else{activeUser=data.user;await refreshSession()}};
 document.getElementById('signUpBtn').onclick=async()=>{message('Creating account…');let {data,error}=await sb.auth.signUp({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPass').value});if(error)message(error.message);else if(data.session){activeUser=data.user;await refreshSession()}else message('Account created. Check your email to confirm, then sign in.')};
 document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();activeUser=null;await refreshSession()};
 window.saveAttempt=async function(){
  if(saved)return;saved=true;
  const total=DATA.length,attempted=ans.filter(a=>a!==null).length,unattempted=total-attempted;
  const hasKey=KEY.length===total;
  const correct=hasKey?ans.reduce((n,a,i)=>n+(a===KEY[i]?1:0),0):null;
  const incorrect=hasKey?attempted-correct:null;
  const score=hasKey?correct*4-incorrect:null;
  const accuracy=hasKey?(attempted?correct/attempted*100:0):null;
  const studentKey=activeUser?.id||'guest';
  const storageKey='aim2aiims_attempts_'+studentKey;
  let localRows=[];try{localRows=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(localRows))localRows=[]}catch(_){localRows=[]}
  let remoteRows=[];
  if(activeUser){
   try{
    const {data,error}=await sb.from('test_attempts').select('test_id,attempt_number,score,correct,incorrect,unattempted,total_questions,accuracy,created_at').eq('user_id',activeUser.id).eq('test_id',TEST).order('attempt_number',{ascending:false}).limit(50);
    if(error)throw error;remoteRows=data||[];
   }catch(e){console.warn('Could not read cloud history:',e.message||e)}
  }
  const maxLocal=localRows.filter(r=>r.test_id===TEST).reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const maxRemote=remoteRows.reduce((m,r)=>Math.max(m,Number(r.attempt_number)||0),0);
  const attempt=Math.max(maxLocal,maxRemote)+1;
  const previous=[...remoteRows,...localRows.filter(r=>r.test_id===TEST)].filter(r=>Number(r.attempt_number)<attempt).sort((a,b)=>Number(b.attempt_number)-Number(a.attempt_number))[0]||null;
  const details=DATA.map((q,i)=>({question_number:q.n,question:q.stem,options:q.options,selected_option:ans[i],correct_option:hasKey?KEY[i]:null,marked_for_review:!!marked[i],status:ans[i]==null?'unattempted':!hasKey?'answered':ans[i]===KEY[i]?'correct':'incorrect'}));
  const record={test_id:TEST,test_name:TEST,attempt_number:attempt,created_at:new Date().toISOString(),total_questions:total,attempted,correct,incorrect,unattempted,score,accuracy,question_details:details,student_id:activeUser?.id||null,storage:'local'};
  localRows.push(record);
  try{localStorage.setItem(storageKey,JSON.stringify(localRows))}catch(e){console.warn('Local result storage failed:',e)}
  let cloudSaved=false,cloudError='';
  if(activeUser){
   try{
    const {error}=await sb.from('test_attempts').insert({user_id:activeUser.id,test_id:TEST,test_name:TEST,total_questions:total,attempted,correct,incorrect,unattempted,score,accuracy,attempt_number:attempt,question_details:details});
    if(error)throw error;cloudSaved=true;record.storage='local+cloud';
    localRows[localRows.length-1]=record;localStorage.setItem(storageKey,JSON.stringify(localRows));
   }catch(e){cloudError=e.message||String(e);console.warn('Cloud result save failed:',cloudError)}
  }
  const priorScore=previous&&previous.score!==null&&previous.score!==undefined?Number(previous.score):null;
  const delta=score!==null&&priorScore!==null?score-priorScore:null;
  const history=localRows.filter(r=>r.test_id===TEST).slice().sort((a,b)=>Number(b.attempt_number)-Number(a.attempt_number)).slice(0,5);
  const box=document.createElement('section');box.className='ri';box.style.marginTop='18px';

  if(score!==null){html+='<p><b>Marks:</b> '+score+' / '+(total*4)+' · <b>Accuracy:</b> '+accuracy.toFixed(1)+'%</p>'}
  else{html+='<p>Score comparison will appear after a verified answer key is added for this paper.</p>'}
  if(previous){
   if(delta!==null)html+='<p><b>Previous attempt:</b> '+(priorScore)+' marks · <b>Change:</b> '+(delta>0?'+':'')+delta+' marks '+(delta>0?'📈':delta<0?'📉':'↔️')+'</p>';
   else html+='<p>Previous attempt #'+previous.attempt_number+' found; score comparison unavailable because a scored answer key is not available.</p>';
  }else html+='<p>This is your first recorded attempt for '+TEST+'.</p>';

  if(cloudError)html+='<p style="color:#b42318;font-size:13px">Cloud save issue: '+esc(cloudError)+'</p>';
  html+='<h4>Recent attempts</h4><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Attempt</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Date</th><th style="text-align:left;padding:7px;border-bottom:1px solid #d8e1ee">Marks</th></tr></thead><tbody>';

  html+='</tbody></table></div><p><a href="student-dashboard.html">Open full result history →</a></p>';
  box.innerHTML=html;$('result').appendChild(box);
 };
 sb.auth.onAuthStateChange((_event,session)=>{activeUser=session?.user||null;refreshSession()});refreshSession();
})();
